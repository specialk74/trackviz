at = 26.2
from = "IF"
to = "AN"
text = "Cancel"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "message"
at = 27.9
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C1"
