# Scene 07 — carrier run-away during sampling (sampling point)
# Three carriers are diverted into the Pit-Lane. After Sample Acquisition for
# the first one, before the needle goes down, the first carrier runs away and
# goes back to the Main-Lane; the second slides under the needle and the
# analyzer aspirates it, believing it is the first. On Sample Complete (with the
# first SampleId) the interface sends Cancel, sends every carrier away and,
# once they are all back on the Main-Lane, sends Clear All.
# Carrier flow: right to left, Pit-Lane above the Main-Lane.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

[video]
title = "Analyzer interface · message exchange with the automation"
subtitle = "Three carriers — carrier run-away during sampling, Cancel and Clear All (sampling point)"
width = 1920
height = 1080
fps = 30
tail = 3.5
show_clock = true
show_times = true

# ---------------------------------------------------------------- track
[[point]]
id = "spawn"
x = 1010
y = 740
[[point]]
id = "main_in"
x = 910
y = 740
[[point]]
id = "nsd"
x = 730
y = 740
[[point]]
id = "pit_in"
x = 620
y = 540
# Queue positions behind the sampling point.
[[point]]
id = "queue2"
x = 560
y = 540
[[point]]
id = "queue"
x = 500
y = 540
[[point]]
id = "sampling"
x = 440
y = 540
[[point]]
id = "pit_out"
x = 290
y = 540
[[point]]
id = "merge"
x = 180
y = 740
[[point]]
id = "main_out"
x = 65
y = 740
[[point]]
id = "gone"
x = -40
y = 740

[[lane]]
id = "main"
label = "Main-Lane"
kind = "main"
points = ["spawn", "main_in", "nsd", "merge", "main_out", "gone"]
label_x = 830
label_y = 800

[[lane]]
id = "pit"
label = "Pit-Lane"
kind = "pit"
points = ["pit_in", "queue2", "queue", "sampling", "pit_out"]
label_x = 250
label_y = 500

[[lane]]
id = "divert"
kind = "link"
points = ["nsd", "pit_in"]

[[lane]]
id = "return"
kind = "link"
points = ["pit_out", "merge"]

[[device]]
id = "interface"
kind = "zone"
label = "Interface module"
x = 90
y = 425
w = 720
h = 420

[[device]]
id = "analyzer"
kind = "analyzer"
label = "Analyzer"
x = 200
y = 185
w = 480
h = 175

[[device]]
id = "nsd"
kind = "nsd"
at = "nsd"

[[device]]
id = "sp"
kind = "sampling"
at = "sampling"
label = "Sampling point"

# ---------------------------------------------------------------- actors
[[actor]]
id = "IF"
label = "Interface"
sub = "Inpeco automation"
color = "#2563EB"

[[actor]]
id = "AN"
label = "Analyzer"
sub = "Instrument"
color = "#EA580C"

[[actor]]
id = "DMX"
label = "DMX"
sub = "LIS"
color = "#059669"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "queue2", "queue", "sampling", "pit_out", "merge", "main_out", "gone"]
speed = 75

[[carrier]]
id = "C2"
tube = true
sample_id = "SID-000124"
route = ["spawn", "main_in", "nsd", "pit_in", "queue2", "queue", "sampling", "pit_out", "merge", "main_out", "gone"]
speed = 75
cap_color = "#0EA5E9"

[[carrier]]
id = "C3"
tube = true
sample_id = "SID-000125"
route = ["spawn", "main_in", "nsd", "pit_in", "queue2", "queue", "sampling", "pit_out", "merge", "main_out", "gone"]
speed = 75
cap_color = "#DB2777"

# ---------------------------------------------------------------- steps
# Messages use `at` (absolute start, seconds) and are written in time order, so
# the rows of the sequence diagram stay in time order. Moves that continue
# another move without stopping use start = "after", right after it.

[[step]]
action = "caption"
at = 0
title = "1 · Three carriers"
text = "Three carriers holding sample tubes are diverted into the Pit-Lane, one after the other: for each one the interface sends Prepare and the analyzer asks DMX which tests to perform."

[[step]]
action = "move"
at = 1.0
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C1"
to = "sampling"
ease = "out"

[[step]]
action = "move"
at = 4.0
carrier = "C2"
to = "nsd"
ease = "linear"

[[step]]
action = "move"
start = "after"
carrier = "C2"
to = "queue"
ease = "out"

[[step]]
action = "move"
at = 7.0
carrier = "C3"
to = "nsd"
ease = "linear"

[[step]]
action = "move"
start = "after"
carrier = "C3"
to = "queue2"
ease = "out"

[[step]]
action = "highlight"
at = 4.77
device = "nsd"
duration = 2.0

[[step]]
action = "highlight"
at = 7.73
device = "nsd"
duration = 2.0

[[step]]
action = "highlight"
at = 10.73
device = "nsd"
duration = 2.0

[[step]]
action = "caption"
at = 13.8
title = "2 · Sample Acquisition"
text = "The first carrier is at the sampling point, the other two queue up behind it. The interface sends Sample Acquisition for the first sample."

[[step]]
action = "caption"
at = 17.0
title = "3 · Carrier run-away"
text = "Before the needle goes down, the first carrier runs away back to the Main-Lane, and the second one slides under the needle. The interface notices it and turns red."

[[step]]
action = "move"
at = 17.0
carrier = "C1"
to = "gone"
ease = "linear"
speed = 120
runaway = true

[[step]]
action = "status"
at = 17.0
device = "interface"
state = "error"

[[step]]
action = "status"
at = 41.65
device = "interface"
state = "normal"

[[step]]
action = "move"
at = 17.9
carrier = "C2"
to = "sampling"
ease = "inout"
duration = 1.2

[[step]]
action = "move"
at = 18.1
carrier = "C3"
to = "queue"
ease = "inout"
duration = 1.2

[[step]]
action = "caption"
at = 19.6
title = "4 · The wrong sample is aspirated"
text = "The analyzer pipettes the tube under the needle: the second sample, while it believes it is sampling the first one."

[[step]]
action = "pipette"
at = 19.8
device = "sp"
duration = 4.5

[[step]]
action = "caption"
at = 24.4
title = "5 · Sample Complete — Cancel"
text = "The analyzer sends Sample Complete for the first sample. The interface knows the first carrier is gone: it sends Cancel for the first sample, and the analyzer replies OK."

[[step]]
action = "caption"
at = 29.6
title = "6 · All carriers sent away — Clear All"
text = "The interface sends every carrier away, without sampling. When they are all back on the Main-Lane it sends Clear All (OK). Once they have left the interface, it turns grey again."

[[step]]
action = "move"
at = 29.6
carrier = "C2"
to = "merge"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C2"
to = "gone"
ease = "out"

[[step]]
action = "move"
at = 30.8
carrier = "C3"
to = "merge"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C3"
to = "gone"
ease = "out"

[[step]]
action = "message"
at = 4.77
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "message"
at = 6.42
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C1"
reply = true

[[step]]
action = "message"
at = 7.73
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C2"

[[step]]
action = "message"
at = 8.3
from = "AN"
to = "DMX"
text = "Query"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "message"
at = 9.38
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C2"
reply = true

[[step]]
action = "message"
at = 9.9
from = "DMX"
to = "AN"
text = "Tests to perform"
params = "SampleId={SampleId}"
carrier = "C1"
reply = true

[[step]]
action = "message"
at = 10.73
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C3"

[[step]]
action = "message"
at = 11.5
from = "AN"
to = "DMX"
text = "Query"
params = "SampleId={SampleId}"
carrier = "C2"

[[step]]
action = "message"
at = 12.38
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C3"
reply = true

[[step]]
action = "message"
at = 13.2
from = "DMX"
to = "AN"
text = "Tests to perform"
params = "SampleId={SampleId}"
carrier = "C2"
reply = true

[[step]]
action = "message"
at = 14.0
from = "IF"
to = "AN"
text = "Sample Acquisition"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "message"
at = 14.8
from = "AN"
to = "DMX"
text = "Query"
params = "SampleId={SampleId}"
carrier = "C3"

[[step]]
action = "message"
at = 16.5
from = "DMX"
to = "AN"
text = "Tests to perform"
params = "SampleId={SampleId}"
carrier = "C3"
reply = true

[[step]]
