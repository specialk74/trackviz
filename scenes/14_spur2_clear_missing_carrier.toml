to = "DMX"
text = "Query"
params = "SampleId={SampleId}"
carrier = "C3"

[[step]]
action = "message"
at = 12.63
from = "IF"
to = "AN"
text = "Clear"
params = "SampleId={SampleId}"
carrier = "C2"

[[step]]
