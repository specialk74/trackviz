# Scene 14 — spur with two needles, a carrier expected in the spur is missing: Clear
# C2 goes straight on the Main-Lane; its logical position is a dashed ghost (C2L). When the
# first divert reads C3 instead of C2 the interface sends Clear for C2 and, after the
# reply, Prepare again for C3.
# Carrier flow: right to left on the Main-Lane, up the spur, down the back branch.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

include = ["common/video.toml", "common/actors.toml", "common/messages.toml", "common/spur2.toml"]

[video]
subtitle = "Spur with two sampling points — a carrier expected in the spur is missing, Clear"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1", "q2", "pc1", "q1", "s1", "pt1u", "rj1", "w2", "d2", "rj2", "top_r", "top_l", "back", "po", "merge", "main_out", "gone"]
speed = 120

# The real C2: it is not diverted.
[[carrier]]
id = "C2"
tube = true
sample_id = "SID-000124"
route = ["spawn", "main_in", "nsd", "merge", "main_out", "gone"]
speed = 120
cap_color = "#0EA5E9"

# Where the interface believes C2 is.
[[carrier]]
id = "C2L"
tube = true
sample_id = "SID-000124"
route = ["nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1"]
speed = 120
cap_color = "#0EA5E9"
ghost = true
visible = false
tag = "SID-000124 (expected)"

[[carrier]]
id = "C3"
tube = true
sample_id = "SID-000125"
route = ["spawn", "main_in", "nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1", "q2", "pc1", "q1", "s1", "pt1u", "rj1", "w2", "d2", "rj2", "top_r", "top_l", "back", "po", "merge", "main_out", "gone"]
speed = 120
cap_color = "#DB2777"

# ---------------------------------------------------------------- steps
# Every step has an absolute start (`at`) and steps are written in time order.

[[step]]
action = "caption"
at = 0
title = "1 · Three carriers"
text = "Three carriers meant for needle 1 of the analyzer travel on the Main-Lane towards the spur."

[[step]]
action = "move"
at = 1.0
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
at = 1.6
carrier = "C2"
to = "gone"
ease = "linear"

[[step]]
action = "caption"
when = "C1 at nsd"
title = "2 · Diverted — Prepare"
text = "The first carrier is diverted into the spur without stopping: the interface sends Prepare to the analyzer."

[[step]]
action = "move"
at = 2.44
carrier = "C1"
to = "d1"
ease = "out"

[[step]]
action = "highlight"
when = "C1 at nsd"
device = "nsd"
duration = 1.6

[[step]]
action = "message"
type = "prepare"
when = "C1 at nsd"
carrier = "C1"

[[step]]
action = "move"
at = 3.35
carrier = "C2L"
to = "w1"
ease = "out"

[[step]]
action = "caption"
at = 3.35
title = "3 · Physically straight, logically diverted"
text = "The second carrier should be diverted too, and the interface sends Prepare. But physically it goes straight on the Main-Lane: the dashed outline is where the interface believes it is."

[[step]]
action = "highlight"
at = 3.35
device = "nsd"
duration = 1.6

[[step]]
action = "message"
type = "prepare"
at = 3.35
carrier = "C2"

[[step]]
action = "show"
at = 3.35
carrier = "C2L"
duration = 0.4

[[step]]
action = "message"
type = "sample_ok"
at = 4.14
carrier = "C1"

[[step]]
action = "move"
at = 4.6
carrier = "C3"
to = "nsd"
ease = "linear"

[[step]]
action = "message"
type = "sample_ok"
at = 5.05
carrier = "C2"

[[step]]
action = "message"
type = "query"
at = 5.84
carrier = "C1"

[[step]]
action = "move"
at = 6.35
carrier = "C3"
to = "d1"
ease = "out"

[[step]]
action = "highlight"
when = "C3 at nsd"
device = "nsd"
duration = 1.6

[[step]]
action = "message"
type = "prepare"
when = "C3 at nsd"
carrier = "C3"

[[step]]
action = "message"
type = "tests"
at = 7.54
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
at = 8.05
carrier = "C3"

[[step]]
action = "highlight"
when = "C1 at d1"
device = "div1"
duration = 0.6

[[step]]
action = "message"
type = "prepare_again"
when = "C1 at d1"
delay = 0.1
carrier = "C1"

[[step]]
action = "move"
at = 9.125
carrier = "C1"
to = "s1"
ease = "inout"

[[step]]
action = "move"
at = 9.925
carrier = "C2L"
to = "d1"
ease = "inout"

[[step]]
action = "message"
type = "query"
at = 9.14
carrier = "C2"

[[step]]
action = "message"
type = "tests"
at = 10.84
carrier = "C2"

[[step]]
action = "message"
type = "sample_acquisition_needle"
needle = 1
when = "C1 at s1"
delay = 0.2
carrier = "C1"

[[step]]
action = "caption"
when = "C3 at d1"
title = "4 · Read at the divert — Clear"
text = "The third carrier stops at the divert on top of the second one, which is not there. It reads the third sample instead of the second: the interface sends Clear for the second."

[[step]]
action = "highlight"
when = "C3 at d1"
device = "div1"
duration = 0.6

[[step]]
action = "message"
type = "query"
at = 12.44
carrier = "C3"

[[step]]
action = "message"
type = "clear"
at = 12.63
carrier = "C2"

[[step]]
action = "pipette"
at = 14.0
device = "sp1"
duration = 6.0

[[step]]
action = "message"
type = "tests"
at = 14.14
carrier = "C3"

[[step]]
action = "message"
type = "sample_ok"
at = 14.23
carrier = "C2"

[[step]]
action = "hide"
at = 15.73
carrier = "C2L"
duration = 0.6

[[step]]
action = "message"
type = "prepare_again"
at = 15.83
carrier = "C3"

[[step]]
action = "caption"
at = 15.83
title = "5 · Prepare again for the third carrier"
text = "Only after the reply to Clear the interface sends Prepare again for the third carrier, and diverts it into the pit-lane, behind the first one."

[[step]]
action = "move"
at = 16.435
carrier = "C3"
to = "q1"
ease = "inout"

[[step]]
action = "message"
type = "sample_complete_needle"
needle = 1
at = 20.2
carrier = "C1"

[[step]]
action = "caption"
at = 20.2
title = "6 · Sample Complete"
text = "Sample Complete: the first carrier is released and the third moves up to the sampling point."

[[step]]
action = "move"
at = 21.7
carrier = "C1"
to = "d2"
ease = "inout"

[[step]]
action = "move"
at = 23.3
carrier = "C3"
to = "s1"
ease = "inout"

[[step]]
action = "message"
type = "sample_acquisition_needle"
needle = 1
when = "C3 at s1"
delay = 0.2
carrier = "C3"

[[step]]
action = "pipette"
at = 25.89
device = "sp1"
duration = 4.0

[[step]]
action = "highlight"
when = "C1 at d2"
device = "div2"
duration = 0.6

[[step]]
action = "move"
at = 26.355
carrier = "C1"
to = "rj2"
ease = "in"

[[step]]
action = "move"
at = 28.319
carrier = "C1"
to = "merge"
ease = "linear"

[[step]]
action = "message"
type = "sample_complete_needle"
needle = 1
at = 30.09
carrier = "C3"

[[step]]
action = "caption"
at = 30.09
title = "7 · Back to normal"
text = "Sample Complete for the third sample: the carrier goes on up the spur, stops at the second divert and, back on the Main-Lane, gets its Release."

[[step]]
action = "move"
at = 31.59
carrier = "C3"
to = "d2"
ease = "inout"

[[step]]
action = "message"
type = "release"
when = "C1 at merge"
carrier = "C1"

[[step]]
action = "move"
at = 35.643
carrier = "C1"
to = "gone"
ease = "out"

[[step]]
action = "highlight"
when = "C3 at d2"
device = "div2"
duration = 0.6

[[step]]
action = "move"
at = 36.245
carrier = "C3"
to = "rj2"
ease = "in"

[[step]]
action = "move"
at = 38.209
carrier = "C3"
to = "merge"
ease = "linear"

[[step]]
action = "message"
type = "release"
when = "C3 at merge"
carrier = "C3"

[[step]]
action = "move"
at = 45.533
carrier = "C3"
to = "gone"
ease = "out"

