# Scene 14 — spur with two needles, a carrier expected in the spur is missing: Clear
# C2 goes straight on the Main-Lane; its logical position is a dashed ghost (C2L). When the
# first divert reads C3 instead of C2 the interface sends Clear for C2 and, after the
# reply, Prepare again for C3.
# Carrier flow: right to left on the Main-Lane, up the spur, down the back branch.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

include = ["common/video.toml", "common/actors.toml", "common/spur2.toml"]

[video]
subtitle = "Spur with two sampling points — a carrier expected in the spur is missing, Clear"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1", "q2", "pc1", "q1", "s1", "pt1u", "rj1", "w2", "d2", "rj2", "top_r", "top_l", "back", "po", "merge", "main_out", "gone"]
speed = 120

# The real C2: it is not diverted.
[[carrier]]
id = "C2"
tube = true
sample_id = "SID-000124"
route = ["spawn", "main_in", "nsd", "merge", "main_out", "gone"]
speed = 120
cap_color = "#0EA5E9"

# Where the interface believes C2 is.
[[carrier]]
id = "C2L"
tube = true
sample_id = "SID-000124"
route = ["nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1"]
speed = 120
cap_color = "#0EA5E9"
ghost = true
visible = false
tag = "SID-000124 (expected)"

[[carrier]]
id = "C3"
tube = true
sample_id = "SID-000125"
route = ["spawn", "main_in", "nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1", "q2", "pc1", "q1", "s1", "pt1u", "rj1", "w2", "d2", "rj2", "top_r", "top_l", "back", "po", "merge", "main_out", "gone"]
speed = 120
cap_color = "#DB2777"

# ---------------------------------------------------------------- steps
# Every step has an absolute start (`at`) and steps are written in time order.

[[step]]
action = "caption"
at = 0
title = "1 · Three carriers"
text = "Three carriers meant for needle 1 of the analyzer travel on the Main-Lane towards the spur."

[[step]]
action = "move"
at = 1.0
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
at = 1.6
carrier = "C2"
to = "gone"
ease = "linear"

[[step]]
action = "caption"
at = 2.439896632895322
title = "2 · Diverted — Prepare"
text = "The first carrier is diverted into the spur without stopping: the interface sends Prepare to the analyzer."

[[step]]
action = "move"
at = 2.44
carrier = "C1"
to = "d1"
ease = "out"

[[step]]
action = "highlight"
at = 2.44
device = "nsd"
duration = 1.6

[[step]]
action = "message"
at = 2.44
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "move"
at = 3.35
carrier = "C2L"
to = "w1"
ease = "out"

[[step]]
action = "caption"
at = 3.35
title = "3 · Physically straight, logically diverted"
text = "The second carrier should be diverted too, and the interface sends Prepare. But physically it goes straight on the Main-Lane: the dashed outline is where the interface believes it is."

[[step]]
action = "highlight"
at = 3.35
device = "nsd"
duration = 1.6

[[step]]
action = "message"
at = 3.35
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C2"

[[step]]
action = "show"
at = 3.35
carrier = "C2L"
duration = 0.4

[[step]]
action = "message"
at = 4.14
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C1"
reply = true

[[step]]
action = "move"
at = 4.6
carrier = "C3"
to = "nsd"
ease = "linear"

[[step]]
action = "message"
at = 5.05
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C2"
reply = true

[[step]]
action = "message"
at = 5.84
from = "AN"
to = "DMX"
text = "Query"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "move"
at = 6.35
carrier = "C3"
to = "d1"
ease = "out"

[[step]]
action = "highlight"
at = 6.35
device = "nsd"
duration = 1.6

[[step]]
action = "message"
at = 6.35
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C3"

[[step]]
action = "message"
at = 7.54
from = "DMX"
to = "AN"
text = "Tests to perform"
params = "SampleId={SampleId}"
carrier = "C1"
reply = true

[[step]]
action = "message"
at = 8.05
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C3"
reply = true

[[step]]
action = "highlight"
at = 8.52
device = "div1"
duration = 0.6

[[step]]
action = "message"
at = 8.62
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C1"
color = "#9333EA"

[[step]]
action = "move"
at = 9.125
carrier = "C1"
to = "s1"
ease = "inout"

[[step]]
action = "move"
at = 9.925
carrier = "C2L"
to = "d1"
ease = "inout"

[[step]]
action = "message"
at = 9.14
from = "AN"
to = "DMX"
text = "Query"
params = "SampleId={SampleId}"
carrier = "C2"

[[step]]
action = "message"
at = 10.84
from = "DMX"
to = "AN"
text = "Tests to perform"
params = "SampleId={SampleId}"
carrier = "C2"
reply = true

[[step]]
action = "message"
at = 12.4
from = "IF"
to = "AN"
text = "Sample Acquisition"
params = "SampleId={SampleId} Needle=1"
carrier = "C1"

[[step]]
action = "caption"
at = 12.43
title = "4 · Read at the divert — Clear"
text = "The third carrier stops at the divert on top of the second one, which is not there. It reads the third sample instead of the second: the interface sends Clear for the second."

[[step]]
action = "highlight"
at = 12.43
