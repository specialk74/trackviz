# ---------------------------------------------------------------- steps
# Every step has an absolute start (`at`) and steps are written in time order.

[[step]]
action = "caption"
at = 0
title = "1 · Three carriers"
text = "Three carriers meant for needle 1 of the analyzer travel on the Main-Lane towards the spur."

[[step]]
action = "move"
at = 1.0
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
at = 1.6
carrier = "C2"
to = "gone"
ease = "linear"

[[step]]
action = "caption"
at = 2.439896632895322
title = "2 · NSD — Prepare"
text = "The first carrier is diverted into the spur without stopping: the interface sends Prepare to the analyzer."

