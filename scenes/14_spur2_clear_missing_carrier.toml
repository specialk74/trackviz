# Scene 14 — spur with two needles, a carrier expected in the spur is missing: Clear
# C2 goes straight on the Main-Lane; its logical position is a dashed ghost (C2L). When the
# first divert reads C3 instead of C2 the interface sends Clear for C2 and, after the
# reply, Prepare again for C3.
# Carrier flow: right to left on the Main-Lane, up the spur, down the back branch.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

include = ["common/video.toml", "common/actors.toml", "common/messages.toml", "common/spur2.toml"]

[video]
subtitle = "Spur with two sampling points — a carrier expected in the spur is missing, Clear"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1", "q2", "pc1", "q1", "s1", "pt1u", "rj1", "w2", "d2", "rj2", "top_r", "top_l", "back", "po", "merge", "main_out", "gone"]
speed = 120

# The real C2: it is not diverted.
[[carrier]]
id = "C2"
tube = true
sample_id = "SID-000124"
route = ["spawn", "main_in", "nsd", "merge", "main_out", "gone"]
speed = 120
cap_color = "#0EA5E9"

# Where the interface believes C2 is.
[[carrier]]
id = "C2L"
tube = true
sample_id = "SID-000124"
route = ["nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1"]
speed = 120
cap_color = "#0EA5E9"
ghost = true
visible = false
tag = "SID-000124 (expected)"

[[carrier]]
id = "C3"
tube = true
sample_id = "SID-000125"
route = ["spawn", "main_in", "nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1", "q2", "pc1", "q1", "s1", "pt1u", "rj1", "w2", "d2", "rj2", "top_r", "top_l", "back", "po", "merge", "main_out", "gone"]
speed = 120
cap_color = "#DB2777"

# ---------------------------------------------------------------- steps
# Every step has an absolute start (`at`) and steps are written in time order.

[[step]]
action = "caption"
at = 0
title = "1 · Three carriers"
text = "Three carriers meant for needle 1 of the analyzer travel on the Main-Lane towards the spur."

[[step]]
action = "move"
at = 1.0
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
at = 1.6
carrier = "C2"
to = "gone"
ease = "linear"

[[step]]
action = "caption"
when = "C1 at nsd"
title = "2 · Diverted — Prepare"
text = "The first carrier is diverted into the spur without stopping: the interface sends Prepare to the analyzer."

[[step]]
action = "highlight"
when = "C1 at nsd"
device = "nsd"
duration = 1.6

[[step]]
action = "message"
type = "prepare"
when = "C1 at nsd"
carrier = "C1"

[[step]]
action = "move"
when = "C1 at nsd"
carrier = "C1"
to = "d1"
ease = "out"

[[step]]
action = "move"
at = 3.35
carrier = "C2L"
to = "w1"
ease = "out"

[[step]]
action = "caption"
when = "prepare C1 sent"
delay = 0.91
title = "3 · Physically straight, logically diverted"
text = "The second carrier should be diverted too, and the interface sends Prepare. But physically it goes straight on the Main-Lane: the dashed outline is where the interface believes it is."

[[step]]
action = "highlight"
when = "prepare C1 sent"
delay = 0.91
device = "nsd"
duration = 1.6

[[step]]
action = "message"
type = "prepare"
when = "C2 at nsd"
carrier = "C2"

[[step]]
action = "show"
when = "prepare C2 sent"
carrier = "C2L"
duration = 0.4

[[step]]
action = "message"
type = "sample_ok"
when = "prepare C1 sent"
delay = 1.7
carrier = "C1"

[[step]]
action = "move"
at = 4.6
carrier = "C3"
to = "nsd"
ease = "linear"

[[step]]
action = "message"
type = "sample_ok"
when = "prepare C2 sent"
delay = 1.7
carrier = "C2"

[[step]]
action = "message"
type = "query"
when = "sample_ok C1 arrived"
delay = 0.2
carrier = "C1"

[[step]]
action = "move"
when = "C3 at nsd"
carrier = "C3"
to = "d1"
ease = "out"

[[step]]
action = "highlight"
when = "C3 at nsd"
device = "nsd"
duration = 1.6

[[step]]
action = "message"
type = "prepare"
when = "C3 at nsd"
carrier = "C3"

[[step]]
action = "message"
type = "tests"
when = "query C1 sent"
delay = 1.7
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
when = "prepare C3 sent"
delay = 1.7
carrier = "C3"

[[step]]
action = "highlight"
when = "C1 at d1"
device = "div1"
duration = 0.6

[[step]]
action = "message"
type = "prepare_again"
when = "C1 at d1"
delay = 0.1
carrier = "C1"

[[step]]
action = "move"
when = "C1 at d1"
delay = 0.6
carrier = "C1"
to = "s1"
ease = "inout"

[[step]]
action = "message"
type = "query"
when = "tests C1 arrived"
delay = 0.1
carrier = "C2"

[[step]]
action = "move"
when = "C2L at w1"
delay = 1.276
carrier = "C2L"
to = "d1"
ease = "inout"

[[step]]
action = "message"
type = "tests"
when = "query C2 sent"
delay = 1.7
carrier = "C2"

[[step]]
action = "message"
type = "sample_acquisition_needle"
needle = 1
when = "C1 at s1"
delay = 0.2
carrier = "C1"

[[step]]
action = "caption"
when = "C3 at d1"
title = "4 · Read at the divert — Clear"
text = "The third carrier stops at the divert on top of the second one, which is not there. It reads the third sample instead of the second: the interface sends Clear for the second."

[[step]]
action = "highlight"
when = "C3 at d1"
device = "div1"
duration = 0.6

[[step]]
action = "message"
type = "query"
when = "tests C2 arrived"
delay = 0.1
carrier = "C3"

[[step]]
action = "message"
type = "clear"
when = "C3 at d1"
delay = 0.195
carrier = "C2"

[[step]]
action = "pipette"
when = "sample_acquisition_needle C1 arrived"
delay = 0.099
device = "sp1"
duration = 6.0

[[step]]
action = "message"
type = "tests"
when = "query C3 sent"
delay = 1.7
carrier = "C3"

[[step]]
action = "message"
type = "sample_ok"
when = "clear C2 sent"
delay = 1.6
carrier = "C2"

[[step]]
action = "hide"
when = "sample_ok C2 arrived"
carrier = "C2L"
duration = 0.6

[[step]]
action = "message"
type = "prepare_again"
when = "sample_ok C2 arrived"
delay = 0.1
carrier = "C3"

[[step]]
action = "caption"
when = "prepare_again C3 sent"
title = "5 · Prepare again for the third carrier"
text = "The carrier does not wait for the reply to Clear: it is diverted right away, behind the first one. Once the reply has arrived the interface sends Prepare again for it."

[[step]]
action = "move"
when = "C3 at d1"
delay = 0.6
carrier = "C3"
to = "q1"
ease = "inout"

[[step]]
action = "message"
type = "sample_complete_needle"
needle = 1
when = "pipette sp1 done"
delay = 0.2
carrier = "C1"

[[step]]
action = "caption"
when = "sample_complete_needle C1 sent"
title = "6 · Sample Complete"
text = "Sample Complete: the first carrier is released and the third moves up to the sampling point."

[[step]]
action = "move"
when = "sample_complete_needle C1 arrived"
carrier = "C1"
to = "d2"
ease = "inout"

[[step]]
action = "move"
when = "sample_complete_needle C1 arrived"
delay = 1.6
carrier = "C3"
to = "s1"
ease = "inout"

[[step]]
action = "message"
type = "sample_acquisition_needle"
needle = 1
when = "C3 at s1"
delay = 0.2
carrier = "C3"

[[step]]
action = "pipette"
when = "sample_acquisition_needle C3 arrived"
delay = 0.105
device = "sp1"
duration = 4.0

[[step]]
action = "highlight"
when = "C1 at d2"
device = "div2"
duration = 0.6

[[step]]
action = "move"
when = "C1 at d2"
delay = 0.401
carrier = "C1"
to = "rj2"
ease = "in"

[[step]]
action = "move"
when = "C1 at rj2"
carrier = "C1"
to = "merge"
ease = "linear"

[[step]]
action = "message"
type = "sample_complete_needle"
needle = 1
when = "pipette sp1 done"
delay = 0.2
carrier = "C3"

[[step]]
action = "caption"
when = "sample_complete_needle C3 sent"
title = "7 · Back to normal"
text = "Sample Complete for the third sample: the carrier goes on up the spur, stops at the second divert and, back on the Main-Lane, gets its Release."

[[step]]
action = "move"
when = "sample_complete_needle C3 arrived"
carrier = "C3"
to = "d2"
ease = "inout"

[[step]]
action = "message"
type = "release"
when = "C1 at merge"
carrier = "C1"

[[step]]
action = "move"
when = "C1 at merge"
carrier = "C1"
to = "gone"
ease = "out"

[[step]]
action = "highlight"
when = "C3 at d2"
device = "div2"
duration = 0.6

[[step]]
action = "move"
when = "C3 at d2"
delay = 0.401
carrier = "C3"
to = "rj2"
ease = "in"

[[step]]
action = "move"
when = "C3 at rj2"
delay = 0.001
carrier = "C3"
to = "merge"
ease = "linear"

[[step]]
action = "message"
type = "release"
when = "C3 at merge"
carrier = "C3"

[[step]]
action = "move"
when = "C3 at merge"
carrier = "C3"
to = "gone"
ease = "out"
