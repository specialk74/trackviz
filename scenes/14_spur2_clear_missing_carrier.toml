# Scene 14 — spur with two needles, a carrier expected in the spur is missing: Clear
# C2 goes straight on the Main-Lane; its logical position is a dashed ghost (C2L). When the
# first divert reads C3 instead of C2 the interface sends Clear for C2 and, after the
# reply, Prepare again for C3.
# Carrier flow: right to left on the Main-Lane, up the spur, down the back branch.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

[video]
title = "Analyzer interface · message exchange with the automation"
subtitle = "Spur with two sampling points — a carrier expected in the spur is missing, Clear"
width = 1920
height = 1080
fps = 30
tail = 3.5
show_clock = true
show_times = true

# ---------------------------------------------------------------- track
# Spur with one analyzer and two sampling points (two needles). The NSD diverts the carrier, without stopping, into the
# spur. On the up branch there are two standard diverts (d1, d2): every carrier
# stops there and is read, then it is diverted into the pit-lane of a needle or
# goes straight on, while the next carrier stops behind. A pit-lane leaves to the
# right, rises past the sampling point (needle on its right) and rejoins the up
# branch above its divert, so a carrier leaving needle 1 still stops at d2.
