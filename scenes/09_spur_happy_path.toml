# Scene 09 — spur, single carrier, happy path
# Prepare -> Sample Acquisition -> Sample Complete -> Release, on a spur.
# Carrier flow: right to left on the Main-Lane; the spur rises perpendicular to it.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

[video]
title = "Analyzer interface · message exchange with the automation"
subtitle = "Spur — single carrier with sample tube, happy path"
width = 1920
height = 1080
fps = 30
tail = 3.5
show_clock = true
show_times = true

# ---------------------------------------------------------------- track
# Spur: a U-shaped branch perpendicular to the Main-Lane. The NSD diverts the
# carrier, without stopping, into a short piece of pit-lane that turns 90° into
# the up branch of the spur; the sampling point is on the up branch, with the
# analyzer on its right. At the top the carrier crosses to the down branch and
# goes back to the Main-Lane.
[[point]]
id = "spawn"
x = 1010
y = 760
[[point]]
id = "main_in"
x = 910
y = 760
[[point]]
id = "nsd"
x = 800
y = 760
[[point]]
id = "merge"
x = 290
y = 760
[[point]]
id = "main_out"
x = 65
y = 760
[[point]]
id = "gone"
x = -40
y = 760
# Divert: diagonal off the NSD, then a 90° turn into the up branch.
[[point]]
id = "pit_in"
x = 740
y = 700
[[point]]
id = "spur_in"
x = 660
y = 700
# Up branch: two queue positions below the sampling point.
[[point]]
id = "queue2"
x = 660
y = 560
[[point]]
id = "queue"
x = 660
y = 500
[[point]]
id = "sampling"
x = 660
y = 440
[[point]]
id = "spur_top_in"
x = 660
y = 250
[[point]]
id = "spur_top_out"
x = 380
y = 250
# Down branch, then a 90° turn back towards the Main-Lane.
[[point]]
id = "spur_out"
x = 380
y = 700
[[point]]
id = "pit_out"
x = 350
y = 700

[[lane]]
id = "main"
label = "Main-Lane"
kind = "main"
points = ["spawn", "main_in", "nsd", "merge", "main_out", "gone"]
label_x = 470
label_y = 820

[[lane]]
id = "spur"
label = "Spur"
kind = "pit"
points = ["pit_in", "spur_in", "queue2", "queue", "sampling", "spur_top_in", "spur_top_out", "spur_out", "pit_out"]
label_x = 490
label_y = 330

[[lane]]
id = "divert"
kind = "link"
points = ["nsd", "pit_in"]

[[lane]]
id = "return"
kind = "link"
points = ["pit_out", "merge"]

[[device]]
id = "interface"
kind = "zone"
label = "Interface module"
x = 250
y = 170
w = 640
h = 660

[[device]]
id = "analyzer"
kind = "analyzer"
label = "Analyzer"
x = 730
y = 330
w = 200
h = 220

[[device]]
id = "nsd"
kind = "nsd"
at = "nsd"

[[device]]
id = "sp"
kind = "sampling"
at = "sampling"
label = "Sampling point"
label_x = 560
label_y = 396

# ---------------------------------------------------------------- actors
[[actor]]
id = "IF"
label = "Interface"
sub = "Inpeco automation"
color = "#2563EB"

[[actor]]
id = "AN"
label = "Analyzer"
sub = "Instrument"
color = "#EA580C"

[[actor]]
id = "DMX"
label = "DMX"
sub = "LIS"
color = "#059669"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "spur_in", "queue2", "queue", "sampling", "spur_top_in", "spur_top_out", "spur_out", "pit_out", "merge", "main_out", "gone"]
speed = 110

# ---------------------------------------------------------------- steps
# Messages use `at` (absolute start, seconds) and are written in time order, so
# the rows of the sequence diagram stay in time order. Moves that continue
# another move without stopping use start = "after", right after it.

[[step]]
action = "caption"
at = 0
title = "1 · Spur"
text = "The spur is a U-shaped branch perpendicular to the Main-Lane: the carrier goes up one branch, past the sampling point (analyzer on its right), and comes back down the other."

[[step]]
action = "move"
at = 1.5
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C1"
to = "sampling"
ease = "out"

[[step]]
action = "caption"
at = 3.07
title = "2 · Diverted — Prepare"
text = "The carrier is diverted without stopping into a short piece of pit-lane that turns 90° into the spur. The interface sends Prepare to the analyzer."

[[step]]
action = "highlight"
at = 3.07
device = "nsd"
duration = 2.0

[[step]]
action = "caption"
at = 6.3
title = "3 · Test query"
text = "After Prepare, the analyzer queries DMX (LIS) to know which tests must be performed on this sample."

[[step]]
action = "caption"
at = 9.4
title = "4 · Sampling point — Sample Acquisition"
text = "The carrier stops at the sampling point on the up branch. The interface sends Sample Acquisition: the tube is in position and can be aspirated."

[[step]]
action = "pipette"
at = 11.2
device = "sp"
duration = 4.5

[[step]]
action = "caption"
at = 15.9
title = "5 · Sample Complete"
text = "When aspiration is finished the analyzer sends Sample Complete. Only then does the interface release the carrier, which goes round the top of the spur and down the other branch."

[[step]]
action = "move"
at = 17.6
carrier = "C1"
to = "spur_top_in"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C1"
to = "merge"
ease = "linear"

[[step]]
action = "move"
start = "after"
carrier = "C1"
to = "gone"
ease = "out"

[[step]]
action = "caption"
at = 27.99
title = "6 · Main-Lane — Release"
text = "As soon as the carrier is back on the Main-Lane, the interface sends Release: the sample has left the analyzer interface."

[[step]]
action = "message"
at = 3.07
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "message"
at = 4.9
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C1"
reply = true

[[step]]
action = "message"
at = 6.5
from = "AN"
to = "DMX"
text = "Query"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "message"
at = 8.0
from = "DMX"
to = "AN"
text = "Tests to perform"
params = "SampleId={SampleId}"
carrier = "C1"
reply = true

[[step]]
action = "message"
at = 9.6
from = "IF"
to = "AN"
text = "Sample Acquisition"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "note"
at = 11.2
actor = "AN"
text = "Pipetting"
duration = 4.5

[[step]]
action = "message"
at = 16.0
from = "AN"
to = "IF"
text = "Sample Complete"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "message"
at = 27.99
from = "IF"
to = "AN"
text = "Release"
params = "SampleId={SampleId}"
carrier = "C1"

