# Scene 10 — spur, a carrier expected in the spur is missing: Clear
# Same situation as scene 03, on a spur. C2 is believed to be diverted (Prepare is sent)
# but physically goes straight on the Main-Lane; its logical position is a dashed ghost
# ("C2L"). C3 queues on top of it. At the sampling point the interface sends Clear for
# C2 and, after the reply, Sample Acquisition for C3.
# Carrier flow: right to left on the Main-Lane; the spur rises perpendicular to it.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

include = ["common/video.toml", "common/actors.toml", "common/messages.toml", "common/spur.toml"]

[video]
subtitle = "Spur — a carrier expected in the spur is missing, Clear"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "spur_in", "queue2", "queue", "sampling", "spur_top_in", "spur_top_out", "spur_out", "pit_out", "merge", "main_out", "gone"]
speed = 110

# The real C2: it is not diverted and goes straight on the Main-Lane.
[[carrier]]
id = "C2"
tube = true
sample_id = "SID-000124"
route = ["spawn", "main_in", "nsd", "merge", "main_out", "gone"]
speed = 110
cap_color = "#0EA5E9"

# Where the interface believes C2 is: diverted into the spur.
[[carrier]]
id = "C2L"
ghost = true
visible = false
tube = true
sample_id = "SID-000124"
tag = "SID-000124 (expected)"
route = ["nsd", "pit_in", "spur_in", "queue2", "queue", "sampling"]
speed = 110
cap_color = "#0EA5E9"

[[carrier]]
id = "C3"
tube = true
sample_id = "SID-000125"
route = ["spawn", "main_in", "nsd", "pit_in", "spur_in", "queue2", "queue", "sampling", "spur_top_in", "spur_top_out", "spur_out", "pit_out", "merge", "main_out", "gone"]
speed = 110
cap_color = "#DB2777"

# ---------------------------------------------------------------- steps
# Messages use `at` (absolute start, seconds) and are written in time order, so
# the rows of the sequence diagram stay in time order. Moves that continue
# another move without stopping use start = "after", right after it.

[[step]]
action = "caption"
at = 0
title = "1 · Three carriers"
text = "Three carriers holding sample tubes travel on the Main-Lane towards the spur of the analyzer interface."

[[step]]
action = "move"
at = 1.5
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C1"
to = "sampling"
ease = "out"

[[step]]
action = "move"
at = 3.59
carrier = "C2"
to = "gone"
ease = "linear"

[[step]]
action = "move"
at = 6.59
carrier = "C3"
to = "nsd"
ease = "linear"

[[step]]
action = "move"
start = "after"
carrier = "C3"
to = "queue"
ease = "out"

[[step]]
action = "caption"
when = "C1 at nsd"
title = "2 · Diverted — Prepare"
text = "The first carrier is diverted into the spur without stopping: the interface sends Prepare to the analyzer."

[[step]]
action = "highlight"
when = "C1 at nsd"
device = "nsd"
duration = 2.0

[[step]]
action = "highlight"
at = 5.5
device = "nsd"
duration = 2.0

[[step]]
action = "highlight"
when = "C3 at nsd"
device = "nsd"
duration = 2.0

[[step]]
action = "caption"
at = 5.5
title = "3 · Physically straight, logically diverted"
text = "The second carrier should be diverted too, and the interface sends Prepare. But physically it goes straight on the Main-Lane: the dashed outline is where the interface believes it is."

[[step]]
action = "show"
at = 5.5
carrier = "C2L"
duration = 0.4

[[step]]
action = "move"
at = 5.5
carrier = "C2L"
to = "queue"
ease = "out"

[[step]]
action = "caption"
when = "C3 at nsd"
title = "4 · Third carrier — Prepare"
text = "The third carrier is diverted into the spur: Prepare. For each Prepare the analyzer asks DMX which tests to perform."

[[step]]
action = "caption"
at = 11.0
title = "5 · Sample Acquisition — the others queue up"
text = "The first carrier is at the sampling point: Sample Acquisition, and the analyzer aspirates. The second (expected) and the third carrier queue up below it."

[[step]]
action = "caption"
at = 13.8
title = "6 · One position, two carriers"
text = "The third carrier stops on the same queue position as the second one: the second is not physically there, it went straight on along the Main-Lane."

[[step]]
action = "caption"
at = 17.8
title = "7 · Sample Complete"
text = "Sampling is finished: Sample Complete. The first carrier is released, and the queue moves up to the sampling point."

[[step]]
action = "move"
at = 19.0
carrier = "C1"
to = "spur_top_in"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C1"
to = "merge"
ease = "linear"

[[step]]
action = "move"
start = "after"
carrier = "C1"
to = "gone"
ease = "out"

[[step]]
action = "move"
at = 20.0
carrier = "C2L"
to = "sampling"
ease = "inout"
duration = 1.2

[[step]]
action = "move"
at = 20.0
carrier = "C3"
to = "sampling"
ease = "inout"
duration = 1.2

[[step]]
action = "caption"
at = 21.4
title = "8 · Clear"
text = "The interface expects the second sample at the sampling point, but finds the third one: the second never arrived. It sends Clear for the second sample and waits for the reply."

[[step]]
action = "hide"
at = 24.5
carrier = "C2L"
duration = 0.6

[[step]]
action = "caption"
at = 24.8
title = "9 · Sample Acquisition"
text = "Only after the reply to Clear the interface sends Sample Acquisition for the third sample."

[[step]]
action = "caption"
when = "C1 at merge"
title = "10 · Release"
text = "The first carrier is back on the Main-Lane: Release."

[[step]]
action = "caption"
at = 31.1
title = "11 · Back to normal"
text = "Sample Complete for the third sample: the carrier goes round the spur and, back on the Main-Lane, the interface sends Release."

[[step]]
action = "move"
at = 32.6
carrier = "C3"
to = "spur_top_in"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C3"
to = "merge"
ease = "linear"

[[step]]
action = "move"
start = "after"
carrier = "C3"
to = "gone"
ease = "out"

[[step]]
action = "message"
type = "prepare"
when = "C1 at nsd"
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
at = 4.7
carrier = "C1"

[[step]]
action = "message"
type = "prepare"
at = 5.5
carrier = "C2"

[[step]]
action = "message"
type = "query"
at = 6.0
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
at = 7.1
carrier = "C2"

[[step]]
action = "message"
type = "tests"
at = 7.8
carrier = "C1"

[[step]]
action = "message"
type = "prepare"
when = "C3 at nsd"
carrier = "C3"

[[step]]
action = "message"
type = "query"
at = 9.4
carrier = "C2"

[[step]]
action = "message"
type = "sample_ok"
at = 10.1
carrier = "C3"

[[step]]
action = "message"
type = "tests"
at = 11.1
carrier = "C2"

[[step]]
action = "message"
type = "sample_acquisition"
at = 11.2
carrier = "C1"

[[step]]
action = "pipette"
at = 12.6
device = "sp"
duration = 5.0

[[step]]
action = "message"
type = "query"
at = 12.7
carrier = "C3"

[[step]]
action = "message"
type = "tests"
at = 14.4
carrier = "C3"

[[step]]
action = "message"
type = "sample_complete"
at = 17.8
carrier = "C1"

[[step]]
action = "message"
type = "clear"
at = 21.4
carrier = "C2"

[[step]]
action = "message"
type = "sample_ok"
at = 23.0
carrier = "C2"

[[step]]
action = "message"
type = "sample_acquisition"
at = 24.8
carrier = "C3"

[[step]]
action = "pipette"
at = 26.4
device = "sp"
duration = 4.5

[[step]]
action = "message"
type = "release"
when = "C1 at merge"
carrier = "C1"

[[step]]
action = "message"
type = "sample_complete"
at = 31.1
carrier = "C3"

[[step]]
action = "message"
type = "release"
when = "C3 at merge"
carrier = "C3"

