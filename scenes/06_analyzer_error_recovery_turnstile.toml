# Scene 06 — analyzer error during sampling, needle left down (turnstile)
# Same situation as scene 05, with the turnstile, gate and antenna of scene 02.
# The wheel can't rotate while the needle is down: after the recovery and
# Status (Ready) it brings the carrier to the exit and releases it.
# Carrier flow: right to left, Pit-Lane above the Main-Lane.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

[video]
title = "Analyzer interface · message exchange with the automation"
subtitle = "Single carrier — analyzer error with the needle down, operator recovery (turnstile)"
width = 1920
height = 1080
fps = 30
tail = 3.5
show_clock = true
show_times = true

# ---------------------------------------------------------------- track
[[point]]
id = "spawn"
x = 1010
y = 740
[[point]]
id = "main_in"
x = 910
y = 740
[[point]]
id = "nsd"
x = 790
y = 740
[[point]]
id = "pit_in"
x = 700
y = 540
# Where carriers stop to be read by the antenna, just before the gate.
[[point]]
id = "pit_wait"
x = 640
y = 540
[[point]]
id = "gate"
x = 596
y = 540
[[point]]
id = "pit_out"
x = 260
y = 540
[[point]]
id = "merge"
x = 160
y = 740
[[point]]
id = "main_out"
x = 65
y = 740
[[point]]
id = "gone"
x = -40
y = 740

# The turnstile generates the points "ts.in", "ts.needle" and "ts.out".
[[device]]
id = "ts"
kind = "turnstile"
label = "Turnstile"
x = 440
y = 505
r = 70
entry = "right"

[[lane]]
id = "main"
label = "Main-Lane"
kind = "main"
points = ["spawn", "main_in", "nsd", "merge", "main_out", "gone"]
label_x = 470
label_y = 800

[[lane]]
id = "pit_entry"
label = "Pit-Lane"
kind = "pit"
points = ["pit_in", "ts.in"]
label_x = 262
label_y = 594

[[lane]]
id = "pit_exit"
kind = "pit"
points = ["ts.out", "pit_out"]

[[lane]]
id = "divert"
kind = "link"
points = ["nsd", "pit_in"]

[[lane]]
id = "return"
kind = "link"
points = ["pit_out", "merge"]

[[device]]
id = "interface"
kind = "zone"
label = "Interface module"
x = 90
y = 380
w = 790
h = 470

[[device]]
id = "analyzer"
kind = "analyzer"
label = "Analyzer"
x = 200
y = 170
w = 480
h = 150

[[device]]
id = "nsd"
kind = "nsd"
at = "nsd"
label = "NSD"

[[device]]
id = "antenna"
kind = "antenna"
at = "pit_wait"
label = "Antenna"

# Opens by itself while a carrier drives through it.
[[device]]
id = "gate"
kind = "gate"
at = "gate"
label = "Gate"

# ---------------------------------------------------------------- actors
[[actor]]
id = "IF"
label = "Interface"
sub = "Inpeco automation"
color = "#2563EB"

[[actor]]
id = "AN"
label = "Analyzer"
sub = "Instrument"
color = "#EA580C"

[[actor]]
id = "DMX"
label = "DMX"
sub = "LIS"
color = "#059669"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "pit_wait", "ts.in", "ts.out", "pit_out", "merge", "main_out", "gone"]
speed = 75

# ---------------------------------------------------------------- steps
# Messages and captions use `at` (absolute start, seconds) so the rows of the
# sequence diagram stay in time order. Status messages carry only the state.

[[step]]
action = "caption"
at = 0
title = "1 · Turnstile with gate and antenna"
text = "A carrier holding a sample tube travels towards the interface. The Pit-Lane ends in a turnstile, with an antenna and a gate in front of it."

[[step]]
action = "move"
at = 2.26
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C1"
to = "pit_wait"
ease = "out"

[[step]]
action = "caption"
at = 4.77
title = "2 · NSD — Prepare"
text = "At the NSD the carrier is diverted into the Pit-Lane without stopping, and the interface sends Prepare to the analyzer."

[[step]]
action = "highlight"
at = 4.77
device = "nsd"
duration = 2.0

[[step]]
action = "message"
at = 4.77
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "message"
at = 6.77
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C1"
reply = true

[[step]]
action = "message"
at = 8.57
from = "AN"
to = "DMX"
text = "Query"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "caption"
at = 10.62
title = "3 · Antenna — Prepare again"
text = "The carrier is read at the antenna: Prepare again. Nothing is being sampled, so the gate opens, the carrier enters and the wheel brings it under the needle."

[[step]]
action = "highlight"
at = 10.62
device = "antenna"
duration = 1.5

[[step]]
action = "message"
at = 10.82
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C1"
color = "#9333EA"

[[step]]
action = "message"
at = 11.1
from = "DMX"
to = "AN"
text = "Tests to perform"
params = "SampleId={SampleId}"
carrier = "C1"
reply = true

[[step]]
action = "move"
at = 12.4
carrier = "C1"
to = "ts.in"
ease = "inout"
duration = 2.0

[[step]]
action = "rotate"
at = 14.55
device = "ts"

[[step]]
action = "caption"
at = 16.6
title = "4 · Sample Acquisition"
text = "The carrier is under the needle: the interface sends Sample Acquisition and the analyzer starts aspirating."

[[step]]
action = "message"
at = 16.8
from = "IF"
to = "AN"
text = "Sample Acquisition"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "needle"
at = 18.400000000000002
device = "ts"
to = "down"

[[step]]
action = "note"
at = 18.400000000000002
actor = "AN"
text = "Pipetting"
duration = 2.6

[[step]]
action = "caption"
at = 21.0
title = "5 · Instrument error"
text = "During aspiration the analyzer goes into error, leaving the needle down in the tube. It immediately sends its status (Error) and Sample Complete. The interface replies OK to the status."

[[step]]
action = "status"
at = 21.0
device = "analyzer"
state = "error"

[[step]]
action = "message"
at = 21.0
from = "AN"
to = "IF"
text = "Status"
params = "State=Error"
carrier = "C1"

[[step]]
action = "message"
at = 21.5
from = "AN"
to = "IF"
text = "Sample Complete"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "message"
at = 22.8
from = "IF"
to = "AN"
text = "OK"
carrier = "C1"
reply = true

[[step]]
action = "caption"
at = 24.6
title = "6 · Operator recovery"
text = "Sample Complete is not enough: with the analyzer in error the wheel does not rotate, the needle is still in the tube. An operator comes to the instrument for a recovery: the needle goes back up."

[[step]]
action = "note"
at = 24.6
actor = "AN"
text = "Operator recovery"
duration = 6.0

[[step]]
action = "operator"
at = 24.6
device = "analyzer"
duration = 7.0

[[step]]
action = "needle"
at = 27.1
device = "ts"
to = "up"
duration = 1.2

[[step]]
action = "caption"
at = 30.900000000000002
title = "7 · Instrument ready"
text = "The instrument is green again: it sends its status (Ready) to the interface, which replies OK. Only now the carrier is released."

[[step]]
action = "status"
at = 30.900000000000002
device = "analyzer"
state = "ready"

[[step]]
action = "message"
at = 30.900000000000002
from = "AN"
to = "IF"
text = "Status"
params = "State=Ready"
carrier = "C1"

[[step]]
action = "message"
at = 32.6
from = "IF"
to = "AN"
text = "OK"
carrier = "C1"
reply = true

[[step]]
action = "caption"
at = 34.3
title = "8 · Carrier released — Release"
text = "The wheel brings the carrier to the exit and the interface releases it. As soon as it is back on the Main-Lane, the interface sends Release."

[[step]]
action = "rotate"
at = 34.3
device = "ts"

[[step]]
action = "move"
at = 36.5
carrier = "C1"
to = "merge"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C1"
to = "gone"
ease = "out"

[[step]]
action = "message"
at = 43.68
from = "IF"
to = "AN"
text = "Release"
params = "SampleId={SampleId}"
carrier = "C1"

