# Scene 05 — analyzer error during sampling, needle left down (sampling point)
# One carrier, geometry of scene 01. While the sample is aspirated the analyzer
# goes into error leaving the needle in the tube: it sends Status (Error), the
# interface replies OK and keeps the carrier still. An operator performs a
# recovery (the needle goes back up); when the instrument is green again it
# sends Status (Ready), the interface replies OK and releases the carrier.
# Carrier flow: right to left, Pit-Lane above the Main-Lane.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).

include = ["common/video.toml", "common/actors.toml", "common/messages.toml", "common/sampling.toml"]

[video]
subtitle = "Single carrier — analyzer error with the needle down, operator recovery"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "sampling", "pit_out", "merge", "main_out"]
speed = 75

# ---------------------------------------------------------------- steps
# Messages and captions use `at` (absolute start, seconds) so the rows of the
# sequence diagram stay in time order. Status messages carry only the state.

[[step]]
action = "caption"
at = 0
title = "1 · Main-Lane"
text = "A carrier holding a sample tube travels along the Main-Lane towards the analyzer interface."

[[step]]
action = "move"
at = 1.0
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C1"
to = "sampling"
ease = "out"

[[step]]
action = "caption"
when = "C1 at nsd"
title = "2 · Diverted — Prepare"
text = "The carrier is diverted into the Pit-Lane without stopping, and the interface sends Prepare to the analyzer."

[[step]]
action = "highlight"
when = "C1 at nsd"
device = "nsd"
duration = 2.0

[[step]]
action = "message"
type = "prepare"
when = "C1 at nsd"
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
at = 6.77
carrier = "C1"

[[step]]
action = "caption"
at = 8.6
title = "3 · Test query"
text = "After Prepare, the analyzer queries DMX (LIS) to know which tests must be performed on this sample."

[[step]]
action = "message"
type = "query"
at = 8.8
carrier = "C1"

[[step]]
action = "message"
type = "tests"
at = 10.8
carrier = "C1"

[[step]]
action = "caption"
at = 13.4
title = "4 · Sampling point — Sample Acquisition"
text = "The carrier stops at the sampling point. The interface sends Sample Acquisition and the analyzer starts aspirating."

[[step]]
action = "message"
type = "sample_acquisition"
when = "C1 at sampling"
delay = 0.28
carrier = "C1"

[[step]]
action = "needle"
at = 15.2
device = "sp"
to = "down"

[[step]]
action = "note"
at = 15.2
actor = "AN"
text = "Pipetting"
duration = 2.6

[[step]]
action = "caption"
at = 17.8
title = "5 · Instrument error"
text = "During aspiration the analyzer goes into error, leaving the needle down in the tube. It immediately sends its status (Error) and Sample Complete. The interface replies OK to the status."

[[step]]
action = "status"
at = 17.8
device = "analyzer"
state = "error"

[[step]]
action = "message"
type = "status_error"
at = 17.8
carrier = "C1"

[[step]]
action = "message"
type = "sample_complete"
at = 18.3
carrier = "C1"

[[step]]
action = "message"
type = "interface_ok"
at = 19.6
carrier = "C1"

[[step]]
action = "caption"
at = 21.400000000000002
title = "6 · Operator recovery"
text = "Sample Complete is not enough: with the analyzer in error the interface does not move the carrier: the needle is still in the tube. An operator walks to the instrument and performs a recovery: the needle is brought back up."

[[step]]
action = "note"
at = 21.400000000000002
actor = "AN"
text = "Operator recovery"
duration = 6.0

[[step]]
action = "operator"
at = 21.400000000000002
device = "analyzer"
duration = 7.0

[[step]]
action = "needle"
at = 23.900000000000002
device = "sp"
to = "up"
duration = 1.2

[[step]]
action = "caption"
at = 27.700000000000003
title = "7 · Instrument ready"
text = "The instrument is green again: it sends its status (Ready) to the interface, which replies OK. Only now the carrier is released."

[[step]]
action = "status"
at = 27.700000000000003
device = "analyzer"
state = "ready"

[[step]]
action = "message"
type = "status_ready"
at = 27.700000000000003
carrier = "C1"

[[step]]
action = "message"
type = "interface_ok"
at = 29.400000000000002
carrier = "C1"

[[step]]
action = "caption"
at = 31.1
title = "8 · Carrier released — Release"
text = "The interface releases the carrier. As soon as it is back on the Main-Lane, the interface sends Release."

[[step]]
action = "move"
at = 31.1
carrier = "C1"
to = "merge"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C1"
to = "main_out"
ease = "out"

[[step]]
action = "message"
type = "release"
when = "C1 at merge"
carrier = "C1"

