# Scene 16 — spur with two needles, carrier run-away on needle 1
# C1 runs away before needle 1 goes down, C2 slides under it and is aspirated instead. On
# Sample Complete the interface sends Cancel, Clear All after the reply and empties that
# pit-lane (red until then). Needle 2 goes on.
# Carrier flow: right to left on the Main-Lane, up the spur, down the back branch.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

include = ["common/video.toml", "common/actors.toml", "common/messages.toml", "common/spur2.toml"]

[video]
subtitle = "Spur with two sampling points — carrier run-away on needle 1, Cancel and Clear All"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1", "q2", "pc1", "q1", "s1", "pt1u", "rj1", "w2", "d2", "rj2", "top_r", "top_l", "back", "po", "merge", "main_out", "gone"]
speed = 120

[[carrier]]
id = "C2"
tube = true
sample_id = "SID-000124"
route = ["spawn", "main_in", "nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1", "q2", "pc1", "q1", "s1", "pt1u", "rj1", "w2", "d2", "rj2", "top_r", "top_l", "back", "po", "merge", "main_out", "gone"]
speed = 120
cap_color = "#0EA5E9"

[[carrier]]
id = "C3"
tube = true
sample_id = "SID-000125"
route = ["spawn", "main_in", "nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1", "q2", "pc1", "q1", "s1", "pt1u", "rj1", "w2", "d2", "rj2", "top_r", "top_l", "back", "po", "merge", "main_out", "gone"]
speed = 120
cap_color = "#DB2777"

# The carrier for needle 2 travels second.
[[carrier]]
id = "C4"
tube = true
sample_id = "SID-000126"
route = ["spawn", "main_in", "nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1", "w2", "d2", "qb2", "pc2", "qb1", "s2", "pt2u", "rj2", "top_r", "top_l", "back", "po", "merge", "main_out", "gone"]
speed = 120
cap_color = "#16A34A"

# ---------------------------------------------------------------- steps
# Every step has an absolute start (`at`) and steps are written in time order.

[[step]]
action = "caption"
at = 0
title = "1 · Four carriers"
text = "Three carriers need needle 1, one needs needle 2. Each one gets Prepare when it enters the spur and Prepare again at the divert that sends it to its needle."

[[step]]
action = "move"
at = 1.0
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
at = 1.6
carrier = "C4"
to = "nsd"
ease = "linear"

[[step]]
action = "highlight"
when = "C1 at nsd"
device = "nsd"
duration = 1.6

[[step]]
action = "message"
type = "prepare"
when = "C1 at nsd"
carrier = "C1"

[[step]]
action = "move"
when = "C1 at nsd"
carrier = "C1"
to = "d1"
ease = "out"

[[step]]
action = "move"
when = "C4 at nsd"
carrier = "C4"
to = "w1"
ease = "out"

[[step]]
action = "highlight"
when = "C4 at nsd"
device = "nsd"
duration = 1.6

[[step]]
action = "message"
type = "prepare"
when = "C4 at nsd"
carrier = "C4"

[[step]]
action = "move"
at = 3.6
carrier = "C2"
to = "nsd"
ease = "linear"

[[step]]
action = "message"
type = "sample_ok"
when = "prepare C1 sent"
delay = 1.7
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
when = "prepare C4 sent"
delay = 1.7
carrier = "C4"

[[step]]
action = "move"
when = "C2 at nsd"
carrier = "C2"
to = "w1b"
ease = "out"

[[step]]
action = "highlight"
when = "C2 at nsd"
device = "nsd"
duration = 1.6

[[step]]
action = "message"
type = "prepare"
when = "C2 at nsd"
carrier = "C2"

[[step]]
action = "move"
at = 5.6
carrier = "C3"
to = "nsd"
ease = "linear"

[[step]]
action = "message"
type = "query"
when = "sample_ok C1 arrived"
delay = 0.2
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
when = "prepare C2 sent"
delay = 1.7
carrier = "C2"

[[step]]
action = "move"
when = "C3 at nsd"
carrier = "C3"
to = "w1c"
ease = "out"

[[step]]
action = "highlight"
when = "C3 at nsd"
device = "nsd"
duration = 1.6

[[step]]
action = "message"
type = "prepare"
when = "C3 at nsd"
carrier = "C3"

[[step]]
action = "message"
type = "tests"
when = "query C1 sent"
delay = 1.7
carrier = "C1"

[[step]]
action = "highlight"
when = "C1 at d1"
device = "div1"
duration = 0.6

[[step]]
action = "message"
type = "prepare_again"
when = "C1 at d1"
delay = 0.1
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
when = "prepare C3 sent"
delay = 1.7
carrier = "C3"

[[step]]
action = "move"
when = "C1 at d1"
delay = 0.6
carrier = "C1"
to = "s1"
ease = "inout"

[[step]]
action = "message"
type = "query"
when = "tests C1 arrived"
delay = 0.1
carrier = "C4"

[[step]]
action = "move"
when = "C4 at w1"
delay = 1.376
carrier = "C4"
to = "d1"
ease = "inout"

[[step]]
action = "move"
when = "C2 at w1b"
delay = 0.523
carrier = "C2"
to = "w1"
ease = "inout"

[[step]]
action = "highlight"
when = "C4 at d1"
device = "div1"
duration = 0.6

[[step]]
action = "message"
type = "tests"
when = "query C4 sent"
delay = 1.7
carrier = "C4"

[[step]]
action = "move"
when = "C4 at d1"
delay = 0.401
carrier = "C4"
to = "d2"
ease = "inout"

[[step]]
action = "move"
when = "C3 at w1c"
delay = 0.556
carrier = "C3"
to = "w1b"
ease = "inout"

[[step]]
action = "move"
when = "C2 at w1"
delay = 1.139
carrier = "C2"
to = "d1"
