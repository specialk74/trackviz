[[step]]
action = "message"
type = "sample_acquisition_needle"
needle = 2
when = "C4 at s2"
delay = 0.2
carrier = "C4"

[[step]]
action = "pipette"
when = "C3 at q1"
delay = 0.296
device = "sp1"
duration = 4.0

[[step]]
action = "highlight"
when = "C1 at d2"
device = "div2"
duration = 0.6

[[step]]
action = "move"
when = "C1 at d2"
delay = 0.3
carrier = "C1"
to = "gone"
ease = "linear"
speed = 170
runaway = true

[[step]]
action = "pipette"
when = "sample_acquisition_needle C4 arrived"
delay = 0.101
device = "sp2"
duration = 4.0

[[step]]
action = "caption"
when = "pipette sp1 done"
delay = 0.2
title = "4 · Sample Complete — Cancel"
text = "The analyzer sends Sample Complete for the first sample, but needle 1 aspirated the second one. The interface sends Cancel for the first sample, and the analyzer replies OK."

[[step]]
action = "message"
type = "sample_complete_needle"
needle = 1
when = "pipette sp1 done"
delay = 0.2
carrier = "C1"

[[step]]
action = "message"
type = "sample_complete_needle"
needle = 2
when = "pipette sp2 done"
delay = 0.2
carrier = "C4"

[[step]]
action = "message"
type = "cancel"
when = "sample_complete_needle C1 arrived"
delay = 0.2
carrier = "C1"

[[step]]
action = "move"
when = "sample_complete_needle C1 arrived"
delay = 0.86
carrier = "C4"
to = "pt2u"
ease = "in"

[[step]]
action = "move"
when = "C4 at pt2u"
carrier = "C4"
to = "merge"
ease = "linear"

[[step]]
action = "message"
type = "sample_ok"
when = "cancel C1 sent"
delay = 1.7
carrier = "C1"

[[step]]
action = "message"
type = "clear_all"
when = "sample_ok C1 arrived"
delay = 0.1

[[step]]
action = "message"
type = "analyzer_ok"
when = "clear_all sent"
delay = 1.7

[[step]]
action = "caption"
when = "sample_ok C1 arrived"
delay = 0.2
title = "5 · Pit-lane emptied — Clear All"
text = "Right after the reply to Cancel: Clear All, which cancels every Prepare. The carriers of needle 1 are sent away without sampling; once they have left its pit-lane, it turns grey."

[[step]]
action = "move"
when = "sample_ok C1 arrived"
delay = 0.2
carrier = "C2"
to = "d2"
ease = "inout"

[[step]]
action = "highlight"
when = "C2 at d2"
device = "div2"
duration = 0.6

[[step]]
action = "move"
when = "C2 at d2"
delay = 0.401
carrier = "C2"
to = "rj2"
ease = "in"

[[step]]
action = "move"
when = "sample_ok C1 arrived"
delay = 5.755
carrier = "C3"
to = "d2"
ease = "inout"

[[step]]
action = "move"
when = "C2 at rj2"
delay = 0.001
carrier = "C2"
to = "merge"
ease = "linear"

[[step]]
action = "message"
type = "release"
when = "C4 at merge"
carrier = "C4"

[[step]]
action = "move"
when = "C4 at merge"
delay = 0.001
carrier = "C4"
to = "gone"
ease = "out"

[[step]]
action = "status"
when = "release C4 arrived"
delay = 0.601
device = "zone1"
state = "normal"

[[step]]
action = "highlight"
when = "C3 at d2"
device = "div2"
duration = 0.6

[[step]]
action = "move"
when = "C3 at d2"
delay = 0.4
carrier = "C3"
to = "rj2"
ease = "in"

[[step]]
action = "move"
when = "C3 at rj2"
carrier = "C3"
to = "merge"
ease = "linear"

[[step]]
