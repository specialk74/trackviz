[[step]]
action = "move"
when = "sample_acquisition_needle C1 arrived"
delay = 2.187
carrier = "C1"
to = "d2"
ease = "inout"
speed = 170
runaway = true

[[step]]
action = "caption"
when = "C2 at q1"
delay = 0.202
title = "3 · Carrier run-away"
text = "Before needle 1 goes down the first carrier runs away. The interface notices it: that part of the interface turns red. The next carrier slides under needle 1."

[[step]]
action = "status"
when = "C2 at q1"
delay = 0.202
device = "zone1"
state = "error"

[[step]]
action = "move"
when = "C2 at q1"
delay = 1.1
carrier = "C2"
to = "s1"
ease = "inout"

[[step]]
action = "message"
type = "tests"
when = "query C3 sent"
delay = 1.7
carrier = "C3"

[[step]]
action = "move"
when = "C3 at q2"
delay = 0.1
