type = "sample_acquisition_needle"
needle = 1
when = "C1 at s1"
delay = 0.3
carrier = "C1"

[[step]]
action = "move"
when = "C3 at w1b"
delay = 0.353
carrier = "C3"
to = "w1"
ease = "inout"

[[step]]
action = "highlight"
when = "C2 at d1"
device = "div1"
duration = 0.6

[[step]]
action = "message"
type = "prepare_again"
when = "C2 at d1"
delay = 0.1
carrier = "C2"

[[step]]
action = "move"
when = "C2 at d1"
delay = 0.601
carrier = "C2"
to = "q1"
ease = "inout"

[[step]]
action = "message"
type = "tests"
when = "query C2 sent"
delay = 1.7
carrier = "C2"

[[step]]
action = "highlight"
when = "C4 at d2"
device = "div2"
duration = 0.6

[[step]]
action = "message"
type = "prepare_again"
when = "C4 at d2"
delay = 0.1
carrier = "C4"

[[step]]
action = "move"
when = "C3 at w1"
delay = 1.239
carrier = "C3"
to = "d1"
ease = "inout"

[[step]]
action = "move"
when = "C4 at d2"
