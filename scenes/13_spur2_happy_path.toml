# Scene 13 — spur with one analyzer and two needles, happy path
# C1 needs both needles, C2 only needle 2: Prepare at the NSD, Prepare again at each
# divert that diverts it, one Sample Acquisition per needle with the Needle parameter.
# Carrier flow: right to left on the Main-Lane, up the spur, down the back branch.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

include = ["common/video.toml", "common/actors.toml", "common/messages.toml", "common/spur2.toml"]

[video]
subtitle = "Spur with one analyzer and two sampling points — happy path"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1", "q2", "pc1", "q1", "s1", "pt1u", "rj1", "w2", "d2", "qb2", "pc2", "qb1", "s2", "pt2u", "rj2", "top_r", "top_l", "back", "po", "merge", "main_out", "gone"]
speed = 120

[[carrier]]
id = "C2"
tube = true
sample_id = "SID-000124"
route = ["spawn", "main_in", "nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1", "w2", "d2", "qb2", "pc2", "qb1", "s2", "pt2u", "rj2", "top_r", "top_l", "back", "po", "merge", "main_out", "gone"]
speed = 120
cap_color = "#0EA5E9"

# ---------------------------------------------------------------- steps
# Every step has an absolute start (`at`) and steps are written in time order.

[[step]]
action = "caption"
at = 0
title = "1 · One analyzer, two sampling points"
text = "The spur serves one analyzer with two needles, each on its own pit-lane. Which needles a sample needs depends on its tests: one of them, or both."

[[step]]
action = "move"
at = 1.0
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
at = 1.6
carrier = "C2"
to = "nsd"
ease = "linear"

[[step]]
action = "caption"
when = "C1 at nsd"
title = "2 · Diverted — Prepare"
text = "Each carrier is diverted into the spur without stopping, and the interface sends Prepare to the analyzer."

[[step]]
action = "move"
at = 2.44
carrier = "C1"
to = "d1"
ease = "out"

[[step]]
action = "highlight"
when = "C1 at nsd"
device = "nsd"
duration = 1.6

[[step]]
action = "message"
type = "prepare"
when = "C1 at nsd"
carrier = "C1"

[[step]]
action = "move"
at = 3.35
carrier = "C2"
to = "w1"
ease = "out"

[[step]]
action = "highlight"
when = "C2 at nsd"
device = "nsd"
duration = 1.6

[[step]]
action = "message"
type = "prepare"
when = "C2 at nsd"
carrier = "C2"

[[step]]
action = "message"
type = "sample_ok"
at = 4.14
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
at = 5.05
carrier = "C2"

[[step]]
action = "message"
type = "query"
at = 5.84
carrier = "C1"

[[step]]
action = "message"
type = "tests"
at = 7.54
carrier = "C1"

[[step]]
action = "highlight"
when = "C1 at d1"
device = "div1"
duration = 0.6

[[step]]
action = "caption"
when = "C1 at d1"
title = "3 · Standard divert — Prepare again"
text = "Unlike at the entrance of the spur, here the carrier stops and is read. This sample needs needle 1: Prepare again, then it is diverted while the next carrier stops behind."

[[step]]
action = "message"
type = "prepare_again"
when = "C1 at d1"
delay = 0.1
carrier = "C1"

[[step]]
action = "move"
at = 9.125
carrier = "C1"
to = "s1"
ease = "inout"

[[step]]
action = "move"
at = 10.225
carrier = "C2"
to = "d1"
ease = "inout"

[[step]]
action = "highlight"
when = "C2 at d1"
device = "div1"
duration = 0.6

[[step]]
action = "caption"
when = "C2 at d1"
title = "4 · The next carrier goes straight on"
text = "The second carrier also stops and is read, but it only needs needle 2: it goes straight on to the second divert, where it gets Prepare again."

[[step]]
action = "move"
at = 11.411
carrier = "C2"
to = "d2"
ease = "inout"

[[step]]
action = "message"
type = "query"
at = 9.14
carrier = "C2"

[[step]]
action = "message"
type = "tests"
at = 10.84
carrier = "C2"

[[step]]
action = "message"
type = "sample_acquisition_needle"
needle = 1
when = "C1 at s1"
delay = 0.3
carrier = "C1"

[[step]]
action = "pipette"
at = 14.1
device = "sp1"
duration = 4.0

[[step]]
action = "highlight"
when = "C2 at d2"
device = "div2"
duration = 0.6

[[step]]
action = "message"
type = "prepare_again"
when = "C2 at d2"
delay = 0.1
carrier = "C2"

[[step]]
action = "move"
at = 15.153
carrier = "C2"
to = "s2"
ease = "inout"

[[step]]
action = "message"
type = "sample_complete_needle"
needle = 1
at = 18.3
carrier = "C1"

[[step]]
action = "caption"
at = 18.43
title = "5 · Sample Acquisition with the needle id"
text = "There is one Sample Acquisition for each sampling point: the Needle parameter tells the analyzer which needle must come out. Sample Complete carries the same id."

[[step]]
action = "message"
type = "sample_acquisition_needle"
needle = 2
when = "C2 at s2"
delay = 0.2
carrier = "C2"

[[step]]
action = "move"
at = 19.8
carrier = "C1"
to = "d2"
ease = "inout"

[[step]]
action = "pipette"
at = 20.03
device = "sp2"
duration = 4.0

[[step]]
action = "caption"
when = "C1 at d2"
title = "6 · The first sample also needs needle 2"
text = "Leaving needle 1 the carrier stops at the second divert: Prepare again. It also needs needle 2, so it enters the second pit-lane right away, even if the carrier ahead is still there."

[[step]]
action = "highlight"
when = "C1 at d2"
device = "div2"
duration = 0.6

[[step]]
action = "message"
type = "prepare_again"
when = "C1 at d2"
delay = 0.1
carrier = "C1"

[[step]]
action = "message"
type = "sample_complete_needle"
needle = 2
at = 24.23
carrier = "C2"

[[step]]
action = "move"
at = 24.655
carrier = "C1"
to = "s2"
ease = "inout"

[[step]]
action = "move"
at = 25.63
carrier = "C2"
to = "pt2u"
ease = "in"

[[step]]
action = "move"
at = 26.612
carrier = "C2"
to = "merge"
ease = "linear"

[[step]]
action = "message"
type = "sample_acquisition_needle"
needle = 2
when = "C1 at s2"
delay = 0.2
carrier = "C1"

[[step]]
action = "pipette"
at = 29.53
device = "sp2"
duration = 4.0

[[step]]
action = "message"
type = "sample_complete_needle"
needle = 2
at = 33.73
carrier = "C1"

[[step]]
action = "move"
at = 35.13
carrier = "C1"
to = "pt2u"
ease = "in"

[[step]]
action = "move"
at = 35.27
carrier = "C2"
to = "gone"
ease = "out"

[[step]]
action = "caption"
when = "C2 at merge"
title = "7 · Main-Lane — Release"
text = "Back on the Main-Lane each carrier gets one Release, however many needles sampled it."

[[step]]
action = "message"
type = "release"
when = "C2 at merge"
carrier = "C2"

[[step]]
action = "move"
at = 36.112
carrier = "C1"
to = "merge"
ease = "linear"

[[step]]
action = "move"
at = 44.77
carrier = "C1"
to = "gone"
ease = "out"

[[step]]
action = "message"
type = "release"
when = "C1 at merge"
carrier = "C1"

