# ---------------------------------------------------------------- steps
# Every step has an absolute start (`at`) and steps are written in time order.

[[step]]
action = "caption"
at = 0
title = "1 · One analyzer, two sampling points"
text = "The spur serves one analyzer with two needles, each on its own pit-lane. Which needles a sample needs depends on its tests: one of them, or both."

[[step]]
action = "move"
at = 1.0
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
at = 1.6
carrier = "C2"
to = "nsd"
ease = "linear"

[[step]]
action = "caption"
at = 2.439896632895322
title = "2 · NSD — Prepare"
text = "At the NSD each carrier is diverted into the spur without stopping, and the interface sends Prepare to the analyzer."

[[step]]
action = "move"
at = 2.44
carrier = "C1"
to = "d1"
ease = "out"

[[step]]
action = "highlight"
at = 2.44
device = "nsd"
duration = 1.6

[[step]]
action = "message"
at = 2.44
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "move"
at = 3.35
carrier = "C2"
to = "w1"
ease = "out"

[[step]]
action = "highlight"
at = 3.35
device = "nsd"
duration = 1.6

[[step]]
action = "message"
at = 3.35
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C2"

[[step]]
