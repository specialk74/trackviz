at = 4.14
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C1"
reply = true

[[step]]
action = "message"
at = 5.05
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C2"
reply = true

[[step]]
