# Scene 12 — spur, carrier run-away during sampling
# Same situation as scene 07, on a spur. C1 runs away before the needle goes down, C2
# slides under the needle and is aspirated instead. On Sample Complete (first SampleId)
# the interface sends Cancel, sends every carrier away and then Clear All. The interface
# is red from the run-away until every carrier has left it.
# Carrier flow: right to left on the Main-Lane; the spur rises perpendicular to it.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

include = ["common/video.toml", "common/actors.toml", "common/messages.toml", "common/spur.toml"]

[video]
subtitle = "Spur — carrier run-away during sampling, Cancel and Clear All"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "spur_in", "queue2", "queue", "sampling", "spur_top_in", "spur_top_out", "spur_out", "pit_out", "merge", "main_out", "gone"]
speed = 110

[[carrier]]
id = "C2"
tube = true
sample_id = "SID-000124"
route = ["spawn", "main_in", "nsd", "pit_in", "spur_in", "queue2", "queue", "sampling", "spur_top_in", "spur_top_out", "spur_out", "pit_out", "merge", "main_out", "gone"]
speed = 110
cap_color = "#0EA5E9"

[[carrier]]
id = "C3"
tube = true
sample_id = "SID-000125"
route = ["spawn", "main_in", "nsd", "pit_in", "spur_in", "queue2", "queue", "sampling", "spur_top_in", "spur_top_out", "spur_out", "pit_out", "merge", "main_out", "gone"]
speed = 110
cap_color = "#DB2777"

# ---------------------------------------------------------------- steps
# Messages use `at` (absolute start, seconds) and are written in time order, so
# the rows of the sequence diagram stay in time order. Moves that continue
# another move without stopping use start = "after", right after it.

[[step]]
action = "caption"
at = 0
title = "1 · Three carriers"
text = "Three carriers holding sample tubes are diverted into the spur, one after the other: for each one the interface sends Prepare and the analyzer asks DMX which tests to perform."

[[step]]
action = "move"
at = 1.5
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C1"
to = "sampling"
ease = "out"

[[step]]
action = "move"
at = 4.0
carrier = "C2"
to = "nsd"
ease = "linear"

[[step]]
action = "move"
start = "after"
carrier = "C2"
to = "queue"
ease = "out"

[[step]]
action = "move"
at = 7.0
carrier = "C3"
to = "nsd"
ease = "linear"

[[step]]
action = "move"
start = "after"
carrier = "C3"
to = "queue2"
ease = "out"

[[step]]
action = "highlight"
when = "C1 at nsd"
device = "nsd"
duration = 2.0

[[step]]
action = "highlight"
when = "C2 at nsd"
device = "nsd"
duration = 2.0

[[step]]
action = "highlight"
when = "C3 at nsd"
device = "nsd"
duration = 2.0

[[step]]
action = "caption"
at = 11.4
title = "2 · Sample Acquisition"
text = "The first carrier is at the sampling point, the other two queue up below it. The interface sends Sample Acquisition for the first sample."

[[step]]
action = "caption"
at = 14.4
title = "3 · Carrier run-away"
text = "Before the needle goes down, the first carrier runs away round the spur and back to the Main-Lane, and the second one slides under the needle. The interface notices it and turns red."

[[step]]
action = "move"
at = 14.4
carrier = "C1"
to = "gone"
ease = "linear"
speed = 150
runaway = true

[[step]]
action = "status"
at = 14.4
device = "interface"
state = "error"

[[step]]
action = "move"
at = 15.3
carrier = "C2"
to = "sampling"
ease = "inout"
duration = 1.2

[[step]]
action = "move"
at = 15.5
carrier = "C3"
to = "queue"
ease = "inout"
duration = 1.2

[[step]]
action = "caption"
at = 16.8
title = "4 · The wrong sample is aspirated"
text = "The analyzer pipettes the tube under the needle: the second sample, while it believes it is sampling the first one."

[[step]]
action = "caption"
at = 21.7
title = "5 · Sample Complete — Cancel"
text = "The analyzer sends Sample Complete for the first sample. The interface knows the first carrier is gone: it sends Cancel for the first sample, and the analyzer replies OK."

[[step]]
action = "caption"
at = 26.8
title = "6 · All carriers sent away — Clear All"
text = "The interface sends every carrier away round the spur, without sampling. When they are all back on the Main-Lane it sends Clear All (OK). Once they have left the interface, it turns grey again."

[[step]]
action = "move"
at = 26.8
carrier = "C2"
to = "spur_top_in"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C2"
to = "merge"
ease = "linear"

[[step]]
action = "move"
start = "after"
carrier = "C2"
to = "gone"
ease = "out"

[[step]]
action = "move"
at = 28.3
carrier = "C3"
to = "spur_top_in"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C3"
to = "merge"
ease = "linear"

[[step]]
action = "move"
start = "after"
carrier = "C3"
to = "gone"
ease = "out"

[[step]]
action = "status"
at = 40.22
device = "interface"
state = "normal"

[[step]]
action = "message"
type = "prepare"
when = "C1 at nsd"
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
at = 4.7
carrier = "C1"

[[step]]
action = "message"
type = "prepare"
when = "C2 at nsd"
carrier = "C2"

[[step]]
action = "message"
type = "query"
at = 6.4
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
at = 7.5
carrier = "C2"

[[step]]
action = "message"
type = "tests"
at = 8.1
carrier = "C1"

[[step]]
action = "message"
type = "prepare"
when = "C3 at nsd"
carrier = "C3"

[[step]]
action = "message"
type = "query"
at = 9.7
carrier = "C2"

[[step]]
action = "message"
type = "sample_ok"
at = 10.5
carrier = "C3"

[[step]]
action = "message"
type = "tests"
at = 11.4
carrier = "C2"

[[step]]
action = "message"
type = "sample_acquisition"
at = 11.6
carrier = "C1"

[[step]]
action = "message"
type = "query"
at = 13.0
carrier = "C3"

[[step]]
action = "message"
type = "tests"
at = 14.7
carrier = "C3"

[[step]]
action = "pipette"
at = 17.0
device = "sp"
duration = 4.5

[[step]]
action = "message"
type = "sample_complete"
at = 21.7
carrier = "C1"

[[step]]
action = "message"
type = "cancel"
at = 23.4
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
at = 25.1
carrier = "C1"

[[step]]
action = "message"
type = "clear_all"
at = 39.55

[[step]]
action = "message"
type = "analyzer_ok"
at = 41.25

