label_x = 470
label_y = 800

[[lane]]
id = "pit_entry"
label = "Pit-Lane"
kind = "pit"
points = ["pit_in", "pit_q", "ts.in"]
label_x = 262
label_y = 594

[[lane]]
id = "pit_exit"
kind = "pit"
points = ["ts.out", "pit_out"]

[[lane]]
id = "divert"
kind = "link"
points = ["nsd", "pit_in"]

[[lane]]
id = "return"
kind = "link"
points = ["pit_out", "merge"]

[[device]]
id = "interface"
kind = "zone"
label = "Interface module"
x = 90
y = 380
w = 790
h = 470

[[device]]
id = "analyzer"
kind = "analyzer"
label = "Analyzer"
x = 200
y = 170
w = 480
h = 150

[[device]]
id = "nsd"
kind = "nsd"
at = "nsd"

[[device]]
id = "antenna"
kind = "antenna"
at = "pit_wait"
label = "Antenna"

# Opens by itself while a carrier drives through it.
[[device]]
id = "gate"
kind = "gate"
at = "gate"
label = "Gate"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "pit_q", "pit_wait", "ts.in", "ts.out", "pit_out", "merge", "main_out", "gone"]
speed = 75

[[carrier]]
id = "C2"
