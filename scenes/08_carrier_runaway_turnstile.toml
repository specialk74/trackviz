[[step]]
action = "caption"
at = 16.6
title = "2 · Sample Acquisition"
text = "The first carrier is under the needle: Sample Acquisition. The second one waits at the closed gate, the third one behind it."

[[step]]
action = "caption"
at = 18.4
title = "3 · Carrier run-away"
text = "Before the needle goes down, the wheel turns by itself: the first carrier goes to the exit and runs away. The interface notices it and turns red. The needle is over an empty pocket."

[[step]]
action = "highlight"
at = 18.4
device = "ts"
duration = 2.0

[[step]]
action = "rotate"
at = 18.4
device = "ts"

[[step]]
