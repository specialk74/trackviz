# Scene 08 — carrier run-away during sampling (turnstile)
# Same situation as scene 07 with the turnstile, gate and antenna of scene 02.
# After Sample Acquisition for the first carrier, before the needle goes down,
# the wheel turns by itself: the first carrier goes to the exit and runs away
# to the Main-Lane. The needle goes down into an empty pocket, but the analyzer
# sends Sample Complete for the first sample. The interface sends Cancel, sends
# the waiting carriers away through the wheel (no sampling) and, right after
# the reply to Cancel, sends Clear All.
# Carrier flow: right to left, Pit-Lane above the Main-Lane.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

include = ["common/video.toml", "common/actors.toml", "common/messages.toml"]

[video]
subtitle = "Three carriers — carrier run-away during sampling, Cancel and Clear All (turnstile)"

# ---------------------------------------------------------------- track
[[point]]
id = "spawn"
x = 1010
y = 740
[[point]]
id = "main_in"
x = 910
y = 740
[[point]]
id = "nsd"
x = 790
y = 740
[[point]]
id = "pit_in"
x = 700
y = 540
# Queue position behind the antenna.
[[point]]
id = "pit_q"
x = 692
y = 540
# Where carriers stop to be read by the antenna, just before the gate.
[[point]]
id = "pit_wait"
x = 640
y = 540
[[point]]
id = "gate"
x = 596
y = 540
[[point]]
id = "pit_out"
x = 260
y = 540
[[point]]
id = "merge"
x = 160
y = 740
[[point]]
id = "main_out"
x = 65
y = 740
[[point]]
id = "gone"
x = -40
y = 740

# The turnstile generates the points "ts.in", "ts.needle" and "ts.out".
[[device]]
id = "ts"
kind = "turnstile"
label = "Turnstile"
x = 440
y = 505
r = 70
entry = "right"

[[lane]]
id = "main"
label = "Main-Lane"
kind = "main"
points = ["spawn", "main_in", "nsd", "merge", "main_out", "gone"]
label_x = 470
label_y = 800

[[lane]]
id = "pit_entry"
label = "Pit-Lane"
kind = "pit"
points = ["pit_in", "pit_q", "ts.in"]
label_x = 262
label_y = 594

[[lane]]
id = "pit_exit"
kind = "pit"
points = ["ts.out", "pit_out"]

[[lane]]
id = "divert"
kind = "link"
points = ["nsd", "pit_in"]

[[lane]]
id = "return"
kind = "link"
points = ["pit_out", "merge"]

[[device]]
id = "interface"
kind = "zone"
label = "Interface module"
x = 90
y = 380
w = 790
h = 470

[[device]]
id = "analyzer"
kind = "analyzer"
label = "Analyzer"
x = 200
y = 170
w = 480
h = 150

[[device]]
id = "nsd"
kind = "nsd"
at = "nsd"

[[device]]
id = "antenna"
kind = "antenna"
at = "pit_wait"
label = "Antenna"

# Opens by itself while a carrier drives through it.
[[device]]
id = "gate"
kind = "gate"
at = "gate"
label = "Gate"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "pit_q", "pit_wait", "ts.in", "ts.out", "pit_out", "merge", "main_out", "gone"]
speed = 75

[[carrier]]
id = "C2"
tube = true
sample_id = "SID-000124"
route = ["spawn", "main_in", "nsd", "pit_in", "pit_q", "pit_wait", "ts.in", "ts.out", "pit_out", "merge", "main_out", "gone"]
speed = 75
cap_color = "#0EA5E9"

[[carrier]]
id = "C3"
tube = true
sample_id = "SID-000125"
route = ["spawn", "main_in", "nsd", "pit_in", "pit_q", "pit_wait", "ts.in", "ts.out", "pit_out", "merge", "main_out", "gone"]
speed = 75
cap_color = "#DB2777"

# ---------------------------------------------------------------- steps
# Messages use `at` (absolute start, seconds) and are written in time order, so
# the rows of the sequence diagram stay in time order. Moves that continue
# another move without stopping use start = "after", right after it.

[[step]]
action = "caption"
at = 0
title = "1 · Three carriers"
text = "Three carriers holding sample tubes are diverted into the Pit-Lane, one after the other: for each one the interface sends Prepare and the analyzer asks DMX which tests to perform."

[[step]]
action = "move"
at = 2.26
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
when = "C1 at nsd"
carrier = "C1"
to = "pit_wait"
ease = "out"

[[step]]
action = "highlight"
when = "C1 at nsd"
device = "nsd"
duration = 2.0

[[step]]
action = "message"
type = "prepare"
when = "C1 at nsd"
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
when = "prepare C1 sent"
delay = 1.597
carrier = "C1"

[[step]]
action = "move"
at = 7.07
carrier = "C2"
to = "nsd"
ease = "linear"

[[step]]
action = "message"
type = "query"
when = "sample_ok C1 arrived"
delay = 0.7
carrier = "C1"

[[step]]
action = "move"
when = "C2 at nsd"
carrier = "C2"
to = "pit_wait"
ease = "out"

[[step]]
action = "highlight"
when = "C2 at nsd"
device = "nsd"
duration = 2.0

[[step]]
action = "message"
type = "prepare"
when = "C2 at nsd"
carrier = "C2"

[[step]]
action = "move"
at = 10.07
carrier = "C3"
to = "nsd"
ease = "linear"

[[step]]
action = "highlight"
when = "C1 at pit_wait"
device = "antenna"
duration = 1.5

[[step]]
action = "message"
type = "prepare_again"
when = "C1 at pit_wait"
delay = 0.2
carrier = "C1"

[[step]]
action = "message"
type = "tests"
when = "query C1 sent"
delay = 2.53
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
when = "prepare C2 sent"
delay = 1.597
carrier = "C2"

[[step]]
action = "move"
when = "C1 at pit_wait"
delay = 1.777
carrier = "C1"
to = "ts.in"
ease = "inout"
duration = 2.0

[[step]]
action = "message"
type = "query"
when = "tests C1 arrived"
delay = 0.1
carrier = "C2"

[[step]]
action = "move"
when = "C3 at nsd"
carrier = "C3"
to = "pit_q"
ease = "out"

[[step]]
action = "highlight"
when = "C3 at nsd"
device = "nsd"
duration = 2.0

[[step]]
action = "message"
type = "prepare"
when = "C3 at nsd"
carrier = "C3"

[[step]]
action = "message"
type = "tests"
when = "query C2 sent"
delay = 1.7
carrier = "C2"

[[step]]
action = "rotate"
when = "C1 at ts.in"
delay = 0.15
device = "ts"

[[step]]
action = "message"
type = "sample_ok"
when = "prepare C3 sent"
delay = 1.597
carrier = "C3"

[[step]]
action = "highlight"
when = "C2 at pit_wait"
device = "antenna"
duration = 1.5

[[step]]
action = "message"
type = "query"
when = "tests C2 arrived"
delay = 0.1
carrier = "C3"

[[step]]
action = "message"
type = "prepare_again"
when = "C2 at pit_wait"
delay = 0.2
carrier = "C2"

[[step]]
action = "caption"
when = "rotate ts done"
delay = 0.05
title = "2 · Sample Acquisition"
text = "The first carrier is under the needle: Sample Acquisition. The second one waits at the closed gate, the third one behind it."

[[step]]
action = "message"
type = "sample_acquisition"
when = "rotate ts done"
delay = 0.25
carrier = "C1"

[[step]]
action = "message"
type = "tests"
when = "query C3 sent"
delay = 1.7
carrier = "C3"

[[step]]
action = "caption"
when = "sample_acquisition C1 arrived"
delay = 0.1
title = "3 · Carrier run-away"
text = "Before the needle goes down, the wheel turns by itself: the first carrier goes to the exit and runs away. The interface notices it and turns red. The needle is over an empty pocket."

[[step]]
action = "highlight"
when = "sample_acquisition C1 arrived"
delay = 0.1
device = "ts"
duration = 2.0

[[step]]
action = "rotate"
when = "sample_acquisition C1 arrived"
delay = 0.1
device = "ts"

[[step]]
action = "status"
when = "sample_acquisition C1 arrived"
delay = 0.1
device = "interface"
state = "error"

[[step]]
action = "move"
when = "rotate ts done"
delay = 0.1
carrier = "C1"
to = "gone"
ease = "linear"
speed = 120
runaway = true

[[step]]
action = "caption"
when = "rotate ts done"
delay = 1.2
title = "4 · Nothing is aspirated"
text = "The analyzer pipettes the empty pocket: there is no tube under the needle, but it believes it is sampling the first sample."

[[step]]
action = "pipette"
when = "sample_acquisition C1 arrived"
delay = 3.5
device = "ts"
duration = 4.5

[[step]]
action = "caption"
when = "pipette ts done"
delay = 0.2
title = "5 · Sample Complete — Cancel"
text = "The analyzer sends Sample Complete for the first sample. The interface knows the first carrier is gone: it sends Cancel for the first sample, and the analyzer replies OK."

[[step]]
action = "message"
type = "sample_complete"
when = "pipette ts done"
delay = 0.2
carrier = "C1"

[[step]]
action = "message"
type = "cancel"
when = "sample_complete C1 arrived"
delay = 0.2
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
when = "cancel C1 sent"
delay = 1.7
carrier = "C1"

[[step]]
action = "message"
type = "clear_all"
when = "sample_ok C1 arrived"
delay = 0.1

[[step]]
action = "message"
type = "analyzer_ok"
when = "clear_all sent"
delay = 1.7

[[step]]
action = "caption"
when = "sample_ok C1 arrived"
delay = 0.2
title = "6 · All carriers sent away — Clear All"
text = "Right after the reply to Cancel the interface sends Clear All, which cancels every Prepare, and sends every carrier away through the wheel, without sampling. Once they have left the interface, it turns grey again."

[[step]]
action = "move"
when = "sample_ok C1 arrived"
delay = 0.2
carrier = "C2"
to = "ts.in"
ease = "inout"
duration = 2.0

[[step]]
action = "rotate"
when = "C2 at ts.in"
delay = 0.15
device = "ts"

[[step]]
action = "move"
when = "sample_ok C1 arrived"
delay = 2.4
carrier = "C3"
to = "pit_wait"
ease = "inout"
duration = 1.2

[[step]]
action = "move"
when = "rotate ts done"
delay = 0.15
carrier = "C3"
to = "ts.in"
ease = "inout"
duration = 2.0

[[step]]
action = "rotate"
when = "C3 at ts.in"
delay = 0.15
device = "ts"

[[step]]
action = "move"
when = "rotate ts done"
delay = 0.15
carrier = "C2"
to = "merge"
ease = "in"

[[step]]
action = "rotate"
when = "rotate ts done"
delay = 2.95
device = "ts"

[[step]]
action = "move"
when = "rotate ts done"
delay = 0.2
carrier = "C3"
to = "merge"
ease = "in"

[[step]]
action = "move"
when = "C2 at merge"
carrier = "C2"
to = "gone"
ease = "out"

[[step]]
action = "move"
when = "C3 at merge"
carrier = "C3"
to = "gone"
ease = "out"

[[step]]
action = "status"
when = "clear_all sent"
delay = 1.37
device = "interface"
state = "normal"

