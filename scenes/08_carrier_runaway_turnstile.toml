[[step]]
action = "caption"
at = 21.6
title = "4 · Nothing is aspirated"
text = "The analyzer pipettes the empty pocket: there is no tube under the needle, but it believes it is sampling the first sample."

[[step]]
action = "caption"
at = 26.5
title = "5 · Sample Complete — Cancel"
text = "The analyzer sends Sample Complete for the first sample. The interface knows the first carrier is gone: it sends Cancel for the first sample, and the analyzer replies OK."

[[step]]
action = "caption"
at = 31.6
title = "6 · All carriers sent away — Clear All"
text = "The interface sends every carrier away through the wheel, without sampling. When they are all back on the Main-Lane it sends Clear All (OK). Once they have left the interface, it turns grey again."

