# Scene 03 — a carrier expected in the Pit-Lane never arrives: Clear (sampling point)
# C1 and C3 are diverted into the Pit-Lane. C2 is believed to be diverted
# (Prepare is sent) but physically goes straight on the Main-Lane. Its logical
# position is shown as a dashed ghost ("C2L") following the Pit-Lane: C3 queues
# on top of it, because physically the ghost is not there. When C3 reaches the
# sampling point, the interface sends Clear for C2 and, after the analyzer's
# reply, Sample Acquisition for C3.
# Carrier flow: right to left, Pit-Lane above the Main-Lane.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

[video]
title = "Analyzer interface · message exchange with the automation"
subtitle = "A carrier expected in the Pit-Lane is missing — Clear (sampling point)"
width = 1920
height = 1080
fps = 30
tail = 3.5
show_clock = true
show_times = true

# ---------------------------------------------------------------- track
[[point]]
id = "spawn"
x = 1010
y = 740
[[point]]
id = "main_in"
x = 910
y = 740
[[point]]
id = "nsd"
x = 730
y = 740
[[point]]
id = "pit_in"
x = 620
y = 540
# Queue position right behind the sampling point.
[[point]]
id = "queue"
x = 500
y = 540
[[point]]
id = "sampling"
x = 440
y = 540
[[point]]
id = "pit_out"
x = 290
y = 540
[[point]]
id = "merge"
x = 180
y = 740
[[point]]
id = "main_out"
x = 65
y = 740
[[point]]
id = "gone"
x = -40
y = 740

[[lane]]
id = "main"
label = "Main-Lane"
kind = "main"
points = ["spawn", "main_in", "nsd", "merge", "main_out", "gone"]
label_x = 830
label_y = 800

[[lane]]
id = "pit"
label = "Pit-Lane"
kind = "pit"
points = ["pit_in", "queue", "sampling", "pit_out"]
label_x = 250
label_y = 500

[[lane]]
id = "divert"
kind = "link"
points = ["nsd", "pit_in"]

[[lane]]
id = "return"
kind = "link"
points = ["pit_out", "merge"]

[[device]]
id = "interface"
kind = "zone"
label = "Interface module"
x = 90
y = 425
w = 720
h = 420

[[device]]
id = "analyzer"
kind = "analyzer"
label = "Analyzer"
x = 200
y = 185
w = 480
h = 175

[[device]]
id = "nsd"
kind = "nsd"
at = "nsd"
label = "NSD"

[[device]]
id = "sp"
kind = "sampling"
at = "sampling"
label = "Sampling point"

# ---------------------------------------------------------------- actors
[[actor]]
id = "IF"
label = "Interface"
sub = "Inpeco automation"
color = "#2563EB"

[[actor]]
id = "AN"
label = "Analyzer"
sub = "Instrument"
color = "#EA580C"

[[actor]]
id = "DMX"
label = "DMX"
sub = "LIS"
color = "#059669"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "queue", "sampling", "pit_out", "merge", "main_out", "gone"]
speed = 75

# The real C2: it is not diverted and goes straight on the Main-Lane.
[[carrier]]
id = "C2"
tube = true
sample_id = "SID-000124"
route = ["spawn", "main_in", "nsd", "merge", "main_out", "gone"]
speed = 75
cap_color = "#0EA5E9"

# Where the interface believes C2 is: diverted into the Pit-Lane.
[[carrier]]
id = "C2L"
ghost = true
visible = false
tube = true
sample_id = "SID-000124"
tag = "SID-000124 (expected)"
route = ["nsd", "pit_in", "queue", "sampling"]
speed = 75
cap_color = "#0EA5E9"

[[carrier]]
id = "C3"
tube = true
sample_id = "SID-000125"
route = ["spawn", "main_in", "nsd", "pit_in", "queue", "sampling", "pit_out", "merge", "main_out", "gone"]
speed = 75
cap_color = "#DB2777"

# ---------------------------------------------------------------- steps
# Messages use `at` so the rows of the sequence diagram stay in time order.

[[step]]
action = "caption"
at = 0
title = "1 · Three carriers"
text = "Three carriers holding sample tubes travel on the Main-Lane towards the analyzer interface."

[[step]]
action = "move"
at = 1.0
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C1"
to = "sampling"
ease = "out"

[[step]]
action = "move"
at = 4.07
carrier = "C2"
to = "gone"
ease = "linear"

[[step]]
action = "move"
at = 7.27
carrier = "C3"
to = "nsd"
ease = "linear"

[[step]]
action = "move"
start = "after"
carrier = "C3"
to = "queue"
ease = "out"

[[step]]
action = "caption"
at = 4.77
title = "2 · NSD — Prepare"
text = "The first carrier is diverted into the Pit-Lane without stopping: the interface sends Prepare to the analyzer."

[[step]]
action = "highlight"
at = 4.77
device = "nsd"
duration = 2.0

[[step]]
action = "message"
at = 4.77
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "message"
at = 6.4
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C1"
reply = true

# C2 reaches the NSD: logically diverted (ghost appears), physically straight on.
[[step]]
action = "caption"
at = 7.8
title = "3 · Physically straight, logically diverted"
text = "The second carrier should be diverted too, and the interface sends Prepare. But physically it goes straight on the Main-Lane: the dashed outline is where the interface believes it is."

[[step]]
action = "highlight"
at = 7.8
device = "nsd"
duration = 2.0

[[step]]
action = "show"
at = 7.8
carrier = "C2L"
duration = 0.4

[[step]]
action = "move"
at = 7.8
carrier = "C2L"
to = "queue"
ease = "out"

[[step]]
action = "message"
at = 7.8
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C2"

[[step]]
action = "message"
at = 8.3
from = "AN"
to = "DMX"
text = "Query"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "message"
at = 9.5
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C2"
reply = true

[[step]]
action = "message"
at = 10.2
from = "DMX"
to = "AN"
text = "Tests to perform"
params = "SampleId={SampleId}"
carrier = "C1"
reply = true

[[step]]
action = "caption"
at = 11.0
title = "4 · Third carrier — Prepare"
text = "The third carrier is diverted into the Pit-Lane: Prepare. For each Prepare the analyzer asks DMX which tests to perform."

[[step]]
action = "highlight"
at = 11.0
device = "nsd"
duration = 2.0

[[step]]
action = "message"
at = 11.0
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C3"

[[step]]
action = "message"
at = 11.8
from = "AN"
to = "DMX"
text = "Query"
params = "SampleId={SampleId}"
carrier = "C2"

[[step]]
action = "message"
at = 12.7
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C3"
reply = true

[[step]]
action = "caption"
at = 13.5
title = "5 · Sample Acquisition — the others queue up"
text = "The first carrier is at the sampling point: Sample Acquisition, and the analyzer aspirates. The second (expected) and the third carrier queue up behind it."

[[step]]
action = "message"
at = 13.5
from = "DMX"
to = "AN"
text = "Tests to perform"
params = "SampleId={SampleId}"
carrier = "C2"
reply = true

[[step]]
action = "message"
at = 14.4
from = "IF"
to = "AN"
text = "Sample Acquisition"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "message"
at = 15.1
from = "AN"
to = "DMX"
text = "Query"
params = "SampleId={SampleId}"
carrier = "C3"

[[step]]
action = "pipette"
at = 16.0
device = "sp"
duration = 5.0

[[step]]
action = "note"
at = 16.0
actor = "AN"
text = "Pipetting"
duration = 5.0

[[step]]
action = "caption"
at = 18.3
title = "6 · One position, two carriers"
text = "The third carrier stops on the same queue position as the second one: the second is not physically there: it went straight on along the Main-Lane."

[[step]]
action = "caption"
at = 21.2
title = "7 · Sample Complete"
text = "Sampling is finished: Sample Complete. The first carrier is released, and the queue moves up to the sampling point."

[[step]]
action = "message"
at = 16.8
from = "DMX"
to = "AN"
text = "Tests to perform"
params = "SampleId={SampleId}"
carrier = "C3"
reply = true

[[step]]
action = "message"
at = 21.2
from = "AN"
to = "IF"
text = "Sample Complete"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "move"
at = 22.5
carrier = "C1"
to = "merge"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C1"
to = "gone"
ease = "out"

[[step]]
action = "move"
at = 25.1
carrier = "C2L"
to = "sampling"
ease = "inout"
duration = 1.5

[[step]]
action = "move"
at = 25.1
carrier = "C3"
to = "sampling"
ease = "inout"
duration = 1.5

[[step]]
action = "caption"
at = 26.8
title = "8 · Clear"
text = "The interface expects the second sample at the sampling point, but finds the third one: the second never arrived. It sends Clear for the second sample and waits for the reply."

[[step]]
action = "message"
at = 26.8
from = "IF"
to = "AN"
text = "Clear"
params = "SampleId={SampleId}"
carrier = "C2"

[[step]]
action = "message"
at = 28.4
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C2"
reply = true

[[step]]
action = "hide"
at = 29.9
carrier = "C2L"
duration = 0.6

[[step]]
action = "caption"
at = 30.2
title = "9 · Sample Acquisition — Release"
text = "Only after the reply to Clear the interface sends Sample Acquisition for the third sample. Meanwhile the first carrier is back on the Main-Lane: Release."

[[step]]
action = "message"
at = 30.2
from = "IF"
to = "AN"
text = "Sample Acquisition"
params = "SampleId={SampleId}"
carrier = "C3"

[[step]]
action = "message"
at = 30.42
from = "IF"
to = "AN"
text = "Release"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "pipette"
at = 31.8
device = "sp"
duration = 4.5

[[step]]
action = "note"
at = 31.8
actor = "AN"
text = "Pipetting"
duration = 4.5

[[step]]
action = "caption"
at = 36.5
title = "10 · Back to normal"
text = "Sample Complete for the third sample: the carrier is released and, back on the Main-Lane, the interface sends Release."

[[step]]
action = "message"
at = 36.5
from = "AN"
to = "IF"
text = "Sample Complete"
params = "SampleId={SampleId}"
carrier = "C3"

[[step]]
action = "move"
at = 38.0
carrier = "C3"
to = "merge"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C3"
to = "gone"
ease = "out"

[[step]]
action = "message"
at = 45.92
from = "IF"
to = "AN"
text = "Release"
params = "SampleId={SampleId}"
carrier = "C3"
