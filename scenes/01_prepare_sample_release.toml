# Scene 01 — single carrier with tube, happy path
# Prepare -> Sample Acquisition -> Sample Complete -> Release
# Carrier flow: right to left, Pit-Lane above the Main-Lane.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).

include = ["common/video.toml", "common/actors.toml", "common/messages.toml", "common/sampling.toml"]

[video]
subtitle = "Single carrier with sample tube — happy path"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "sampling", "pit_out", "merge", "main_out"]
speed = 75

# ---------------------------------------------------------------- steps
# start = "after" (default: when the previous step ends) | "with" (same start
# as the previous step) | "after_all" (when every previous step has ended)

[[step]]
action = "caption"
at = 0.0000
title = "1 · Main-Lane"
text = "A carrier holding a sample tube travels along the Main-Lane towards the analyzer interface."

[[step]]
action = "move"
at = 1.0000
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "caption"
when = "C1 at nsd"
title = "2 · Diverted — Prepare"
text = "The carrier is diverted into the Pit-Lane without stopping. At this moment the interface sends Prepare to the analyzer."

[[step]]
action = "highlight"
when = "C1 at nsd"
device = "nsd"
duration = 2.0

[[step]]
action = "move"
when = "C1 at nsd"
carrier = "C1"
to = "sampling"
ease = "out"

[[step]]
action = "message"
when = "C1 at nsd"
type = "prepare"
carrier = "C1"

[[step]]
action = "message"
when = "prepare C1 sent"
delay = 2.0
type = "sample_ok"
carrier = "C1"

[[step]]
action = "caption"
when = "sample_ok C1 arrived"
delay = 1.8
title = "3 · Test query"
text = "After Prepare, the analyzer queries DMX (LIS) to know which tests must be performed on this sample."

[[step]]
action = "message"
when = "sample_ok C1 arrived"
delay = 2.1
type = "query"
carrier = "C1"

[[step]]
action = "message"
when = "query C1 sent"
delay = 2.0
type = "tests"
carrier = "C1"

[[step]]
action = "caption"
when = "tests C1 arrived"
delay = 0.6
title = "4 · Sampling point — Sample Acquisition"
text = "The carrier stops at the sampling point. The interface sends Sample Acquisition: the tube is in position and can be aspirated."

[[step]]
action = "message"
when = "C1 at sampling"
delay = 1.45
type = "sample_acquisition"
carrier = "C1"

[[step]]
action = "message"
type = "analyzer_ok"
when = "sample_acquisition C1 arrived"
delay = 0.1
carrier = "C1"

[[step]]
action = "caption"
when = "sample_acquisition C1 arrived"
delay = 2.0
title = "5 · Pipetting"
text = "The analyzer aspirates the biological material from the tube. Meanwhile the carrier is held at the sampling point."

[[step]]
action = "pipette"
when = "analyzer_ok C1 arrived"
delay = 0.1
device = "sp"
duration = 4.5

[[step]]
action = "caption"
when = "pipette sp done"
delay = 0.3
title = "6 · Sample Complete"
text = "When aspiration is finished the analyzer sends Sample Complete. Only after receiving it does the interface release the carrier."

[[step]]
action = "message"
when = "pipette sp done"
delay = 0.6
type = "sample_complete"
carrier = "C1"

[[step]]
action = "message"
type = "interface_ok"
when = "sample_complete C1 arrived"
delay = 0.1
carrier = "C1"

[[step]]
action = "caption"
when = "sample_complete C1 arrived"
delay = 2.8
title = "7 · Carrier released"
text = "The interface releases the carrier: it leaves the Pit-Lane and heads back to the Main-Lane."

[[step]]
action = "move"
when = "interface_ok C1 sent"
delay = 3.1
carrier = "C1"
to = "merge"
ease = "in"

[[step]]
action = "move"
when = "C1 at merge"
carrier = "C1"
to = "main_out"
ease = "out"

[[step]]
action = "caption"
when = "C1 at main_out"
title = "8 · Release"
text = "As soon as the carrier with the tube has left the interface module, the interface sends Release: the sample has left the analyzer interface."

[[step]]
action = "message"
when = "C1 at main_out"
type = "release"
carrier = "C1"

[[step]]
action = "message"
type = "analyzer_ok"
when = "release C1 arrived"
delay = 0.1
carrier = "C1"

[[step]]
action = "caption"
when = "C1 at main_out"
delay = 2.5
title = "9 · Results"
text = "Later, when the analysis is complete, the analyzer sends the results to DMX."

[[step]]
action = "note"
when = "C1 at main_out"
delay = 2.8
actor = "AN"
text = "Analysis"
duration = 1.5

[[step]]
action = "message"
when = "C1 at main_out"
delay = 4.3
type = "results"
carrier = "C1"

