speed = 120
cap_color = "#0EA5E9"

# ---------------------------------------------------------------- steps
# Every step has an absolute start (`at`) and steps are written in time order.

[[step]]
action = "caption"
at = 0
title = "1 · One analyzer, two sampling points"
text = "Two carriers travel towards the spur: the first one needs needle 1, the second one needle 2."

[[step]]
action = "move"
at = 1.0
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
at = 1.6
carrier = "C2"
to = "nsd"
ease = "linear"

[[step]]
action = "caption"
at = 2.439896632895322
title = "2 · NSD — Prepare"
text = "Each carrier is diverted into the spur without stopping, and the interface sends Prepare to the analyzer."

[[step]]
action = "move"
at = 2.44
carrier = "C1"
to = "d1"
ease = "out"

[[step]]
action = "highlight"
at = 2.44
device = "nsd"
duration = 1.6

[[step]]
action = "message"
at = 2.44
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "move"
at = 3.35
carrier = "C2"
to = "w1"
ease = "out"

[[step]]
action = "highlight"
at = 3.35
device = "nsd"
duration = 1.6

[[step]]
action = "message"
at = 3.35
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C2"

[[step]]
action = "message"
at = 4.14
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C1"
reply = true

[[step]]
action = "message"
at = 5.05
from = "AN"
to = "IF"
text = "OK"
params = "SampleId={SampleId}"
carrier = "C2"
reply = true

[[step]]
action = "message"
at = 5.84
from = "AN"
to = "DMX"
text = "Query"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "message"
at = 7.54
from = "DMX"
to = "AN"
text = "Tests to perform"
params = "SampleId={SampleId}"
carrier = "C1"
reply = true

[[step]]
action = "highlight"
at = 8.52
device = "div1"
duration = 0.6

[[step]]
action = "message"
at = 8.62
from = "IF"
to = "AN"
text = "Prepare"
params = "SampleId={SampleId}"
carrier = "C1"
color = "#9333EA"

[[step]]
action = "move"
at = 9.125
carrier = "C1"
to = "s1"
ease = "inout"

[[step]]
action = "move"
at = 10.225
carrier = "C2"
to = "d1"
ease = "inout"

[[step]]
action = "highlight"
at = 11.01
device = "div1"
duration = 0.6

[[step]]
action = "move"
at = 11.411
carrier = "C2"
to = "d2"
ease = "inout"

[[step]]
action = "caption"
at = 12.4
title = "3 · Sample Acquisition"
text = "The first carrier is at sampling point 1: Sample Acquisition with Needle=1, and the needle starts aspirating."

[[step]]
action = "message"
at = 9.14
from = "AN"
to = "DMX"
text = "Query"
params = "SampleId={SampleId}"
carrier = "C2"

[[step]]
action = "message"
at = 10.84
from = "DMX"
to = "AN"
text = "Tests to perform"
