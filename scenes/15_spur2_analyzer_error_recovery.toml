[[step]]
action = "message"
at = 28.6
from = "IF"
to = "AN"
text = "OK"
reply = true

[[step]]
action = "move"
at = 30.2
carrier = "C1"
to = "d2"
ease = "inout"

[[step]]
action = "highlight"
at = 34.45
device = "div2"
duration = 0.6

[[step]]
action = "move"
at = 34.855
