at = 16.6
device = "sp1"
state = "error"

[[step]]
action = "message"
at = 16.6
from = "AN"
to = "IF"
text = "Status"
params = "State=Error Needle=1"

[[step]]
action = "message"
at = 17.1
from = "AN"
to = "IF"
text = "Sample Complete"
params = "SampleId={SampleId} Needle=1"
