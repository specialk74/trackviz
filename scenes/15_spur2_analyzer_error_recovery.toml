at = 35.64
title = "7 · Main-Lane — Release"
text = "Each carrier gets its Release when it is back on the Main-Lane."

[[step]]
action = "message"
at = 35.64
from = "IF"
to = "AN"
text = "Release"
params = "SampleId={SampleId}"
carrier = "C2"

[[step]]
action = "move"
at = 36.819
carrier = "C1"
to = "merge"
ease = "linear"

[[step]]
action = "message"
at = 44.14
from = "IF"
to = "AN"
text = "Release"
params = "SampleId={SampleId}"
carrier = "C1"

[[step]]
action = "move"
at = 44.143
carrier = "C1"
to = "gone"
ease = "out"

