[[step]]
action = "caption"
at = 16.6
title = "4 · Error on needle 1"
text = "Needle 1 goes into error, left down in the tube: the analyzer sends its status (Error, Needle=1) and Sample Complete, and the interface replies OK to the status. The carrier stays still."

[[step]]
