# Scene 15 — spur with two needles, error on needle 1, needle 2 goes on
# Needle 1 goes into error left down in the tube; its carrier is released only after
# Status (Ready). Needle 2 keeps working normally during the recovery.
# Carrier flow: right to left on the Main-Lane, up the spur, down the back branch.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

include = ["common/video.toml", "common/actors.toml", "common/messages.toml", "common/spur2.toml"]

[video]
subtitle = "Spur with two sampling points — needle 1 in error, needle 2 goes on"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1", "q2", "pc1", "q1", "s1", "pt1u", "rj1", "w2", "d2", "rj2", "top_r", "top_l", "back", "po", "merge", "main_out", "gone"]
speed = 120

[[carrier]]
id = "C2"
tube = true
sample_id = "SID-000124"
route = ["spawn", "main_in", "nsd", "pit_in", "w1c", "w1b", "spur_in", "w1", "d1", "w2", "d2", "qb2", "pc2", "qb1", "s2", "pt2u", "rj2", "top_r", "top_l", "back", "po", "merge", "main_out", "gone"]
speed = 120
cap_color = "#0EA5E9"

# ---------------------------------------------------------------- steps
# Every step has an absolute start (`at`) and steps are written in time order.

[[step]]
action = "caption"
at = 0
title = "1 · One analyzer, two sampling points"
text = "Two carriers travel towards the spur: the first one needs needle 1, the second one needle 2."

[[step]]
action = "move"
at = 1.0
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
at = 1.6
carrier = "C2"
to = "nsd"
ease = "linear"

[[step]]
action = "caption"
when = "C1 at nsd"
title = "2 · Diverted — Prepare"
text = "Each carrier is diverted into the spur without stopping, and the interface sends Prepare to the analyzer."

[[step]]
action = "move"
at = 2.44
carrier = "C1"
to = "d1"
ease = "out"

[[step]]
action = "highlight"
when = "C1 at nsd"
device = "nsd"
duration = 1.6

[[step]]
action = "message"
type = "prepare"
when = "C1 at nsd"
carrier = "C1"

[[step]]
action = "move"
at = 3.35
carrier = "C2"
to = "w1"
ease = "out"

[[step]]
action = "highlight"
when = "C2 at nsd"
device = "nsd"
duration = 1.6

[[step]]
action = "message"
type = "prepare"
when = "C2 at nsd"
carrier = "C2"

[[step]]
action = "message"
type = "sample_ok"
at = 4.14
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
at = 5.05
carrier = "C2"

[[step]]
action = "message"
type = "query"
at = 5.84
carrier = "C1"

[[step]]
action = "message"
type = "tests"
at = 7.54
carrier = "C1"

[[step]]
action = "highlight"
when = "C1 at d1"
device = "div1"
duration = 0.6

[[step]]
action = "message"
type = "prepare_again"
when = "C1 at d1"
delay = 0.1
carrier = "C1"

[[step]]
action = "move"
at = 9.125
carrier = "C1"
to = "s1"
ease = "inout"

[[step]]
action = "move"
at = 10.225
carrier = "C2"
to = "d1"
ease = "inout"

[[step]]
action = "highlight"
when = "C2 at d1"
device = "div1"
duration = 0.6

[[step]]
action = "move"
at = 11.411
carrier = "C2"
to = "d2"
ease = "inout"

[[step]]
action = "caption"
at = 12.4
title = "3 · Sample Acquisition"
text = "The first carrier is at sampling point 1: Sample Acquisition with Needle=1, and the needle starts aspirating."

[[step]]
action = "message"
type = "query"
at = 9.14
carrier = "C2"

[[step]]
action = "message"
type = "tests"
at = 10.84
carrier = "C2"

[[step]]
action = "message"
type = "sample_acquisition_needle"
needle = 1
when = "C1 at s1"
delay = 0.2
carrier = "C1"

[[step]]
action = "needle"
at = 14.0
device = "sp1"
to = "down"

[[step]]
action = "note"
at = 14.0
actor = "AN"
text = "Pipetting · Needle 1"
duration = 2.6

[[step]]
action = "highlight"
when = "C2 at d2"
device = "div2"
duration = 0.6

[[step]]
action = "message"
type = "prepare_again"
when = "C2 at d2"
delay = 0.1
carrier = "C2"

[[step]]
action = "move"
at = 15.153
carrier = "C2"
to = "s2"
ease = "inout"

[[step]]
action = "caption"
at = 16.6
title = "4 · Error on needle 1"
text = "Needle 1 goes into error, left down in the tube: the analyzer sends its status (Error, Needle=1) and Sample Complete, and the interface replies OK to the status. The carrier stays still."

[[step]]
action = "status"
at = 16.6
device = "sp1"
state = "error"

[[step]]
action = "message"
type = "status_error_needle"
needle = 1
at = 16.6

[[step]]
action = "message"
type = "sample_complete_needle"
needle = 1
at = 17.1
carrier = "C1"

[[step]]
action = "message"
type = "interface_ok"
at = 18.4

[[step]]
action = "message"
type = "sample_acquisition_needle"
needle = 2
when = "C2 at s2"
delay = 0.57
carrier = "C2"

[[step]]
action = "pipette"
at = 20.4
device = "sp2"
duration = 4.0

[[step]]
action = "caption"
at = 20.6
title = "5 · Operator recovery — needle 2 goes on"
text = "An operator comes to the instrument for a recovery of needle 1, which goes back up. Meanwhile needle 2 keeps working normally on its own carrier."

[[step]]
action = "operator"
at = 20.6
device = "an"
duration = 7.0

[[step]]
action = "note"
at = 20.610000000000003
actor = "AN"
text = "Operator recovery · Needle 1"
duration = 6.0

[[step]]
action = "needle"
at = 23.1
device = "sp1"
to = "up"
duration = 1.2

[[step]]
action = "message"
type = "sample_complete_needle"
needle = 2
at = 24.6
carrier = "C2"

[[step]]
action = "move"
at = 26.0
carrier = "C2"
to = "pt2u"
ease = "in"

[[step]]
action = "caption"
at = 26.9
title = "6 · Needle 1 ready"
text = "Needle 1 is green again: the analyzer sends its status (Ready, Needle=1), the interface replies OK, and only now releases the carrier. Sample Complete alone was not enough."

[[step]]
action = "status"
at = 26.9
device = "sp1"
state = "ready"

[[step]]
action = "message"
type = "status_ready_needle"
needle = 1
at = 26.9

[[step]]
action = "move"
at = 26.982
carrier = "C2"
to = "merge"
ease = "linear"

[[step]]
action = "message"
type = "interface_ok"
at = 28.6

[[step]]
action = "move"
at = 30.2
carrier = "C1"
to = "d2"
ease = "inout"

[[step]]
action = "highlight"
when = "C1 at d2"
device = "div2"
duration = 0.6

[[step]]
action = "move"
at = 34.855
carrier = "C1"
to = "rj2"
ease = "in"

[[step]]
action = "move"
at = 35.64
carrier = "C2"
to = "gone"
ease = "out"

[[step]]
action = "caption"
when = "C2 at merge"
title = "7 · Main-Lane — Release"
text = "Each carrier gets its Release when it is back on the Main-Lane."

[[step]]
action = "message"
type = "release"
when = "C2 at merge"
carrier = "C2"

[[step]]
action = "move"
at = 36.819
carrier = "C1"
to = "merge"
ease = "linear"

[[step]]
action = "message"
type = "release"
when = "C1 at merge"
carrier = "C1"

[[step]]
action = "move"
at = 44.143
carrier = "C1"
to = "gone"
ease = "out"

