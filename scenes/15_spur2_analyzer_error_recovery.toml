[[step]]
action = "message"
at = 18.4
from = "IF"
to = "AN"
text = "OK"
reply = true

[[step]]
action = "message"
at = 18.8
from = "IF"
to = "AN"
text = "Sample Acquisition"
params = "SampleId={SampleId} Needle=2"
carrier = "C2"

[[step]]
action = "pipette"
at = 20.4
device = "sp2"
duration = 4.0

[[step]]
action = "note"
at = 20.4
actor = "AN"
text = "Pipetting · Needle 2"
