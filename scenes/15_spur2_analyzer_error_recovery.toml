to = "up"
duration = 1.2

[[step]]
action = "message"
at = 24.6
from = "AN"
to = "IF"
text = "Sample Complete"
params = "SampleId={SampleId} Needle=2"
carrier = "C2"

[[step]]
action = "move"
at = 26.0
carrier = "C2"
to = "pt2u"
ease = "in"

[[step]]
action = "caption"
at = 26.9
title = "6 · Needle 1 ready"
text = "Needle 1 is green again: the analyzer sends its status (Ready, Needle=1), the interface replies OK, and only now releases the carrier. Sample Complete alone was not enough."

