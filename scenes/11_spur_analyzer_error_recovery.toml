# Scene 11 — spur, analyzer error during sampling with the needle down, operator recovery
# Same situation as scene 05, on a spur. On error the analyzer sends Status (Error) and
# Sample Complete; the carrier is released only after Status (Ready).
# Carrier flow: right to left on the Main-Lane; the spur rises perpendicular to it.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

include = ["common/video.toml", "common/actors.toml", "common/messages.toml", "common/spur.toml"]

[video]
subtitle = "Spur — analyzer error with the needle down, operator recovery"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "spur_in", "queue2", "queue", "sampling", "spur_top_in", "spur_top_out", "spur_out", "pit_out", "merge", "main_out", "gone"]
speed = 110

# ---------------------------------------------------------------- steps
# Messages use `at` (absolute start, seconds) and are written in time order, so
# the rows of the sequence diagram stay in time order. Moves that continue
# another move without stopping use start = "after", right after it.

[[step]]
action = "caption"
at = 0
title = "1 · Spur"
text = "A carrier holding a sample tube travels along the Main-Lane towards the spur of the analyzer interface."

[[step]]
action = "move"
at = 1.5
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
when = "C1 at nsd"
carrier = "C1"
to = "sampling"
ease = "out"

[[step]]
action = "caption"
when = "C1 at nsd"
title = "2 · Diverted — Prepare"
text = "The carrier is diverted into the spur without stopping, and the interface sends Prepare to the analyzer."

[[step]]
action = "highlight"
when = "C1 at nsd"
device = "nsd"
duration = 2.0

[[step]]
action = "message"
type = "prepare"
when = "C1 at nsd"
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
when = "prepare C1 sent"
delay = 1.829
carrier = "C1"

[[step]]
action = "caption"
when = "sample_ok C1 sent"
delay = 1.4
title = "3 · Test query"
text = "After Prepare, the analyzer queries DMX (LIS) to know which tests must be performed on this sample."

[[step]]
action = "message"
type = "query"
when = "sample_ok C1 arrived"
delay = 0.1
carrier = "C1"

[[step]]
action = "message"
type = "tests"
when = "query C1 sent"
delay = 1.5
carrier = "C1"

[[step]]
action = "caption"
when = "C1 at sampling"
delay = 0.262
title = "4 · Sampling point — Sample Acquisition"
text = "The carrier stops at the sampling point. The interface sends Sample Acquisition and the analyzer starts aspirating."

[[step]]
action = "message"
type = "sample_acquisition"
when = "C1 at sampling"
delay = 0.46
carrier = "C1"

[[step]]
action = "needle"
when = "sample_acquisition C1 arrived"
delay = 0.102
device = "sp"
to = "down"

[[step]]
action = "note"
when = "sample_acquisition C1 arrived"
delay = 0.102
actor = "AN"
text = "Pipetting"
duration = 2.6

[[step]]
action = "caption"
when = "needle sp done"
delay = 1.7
title = "5 · Instrument error"
text = "During aspiration the analyzer goes into error, leaving the needle down in the tube. It immediately sends its status (Error) and Sample Complete. The interface replies OK to the status."

[[step]]
action = "status"
when = "needle sp done"
delay = 1.7
device = "analyzer"
state = "error"

[[step]]
action = "message"
type = "status_error"
when = "needle sp done"
delay = 1.7

[[step]]
action = "message"
type = "sample_complete"
when = "status_error sent"
delay = 0.5
carrier = "C1"

[[step]]
action = "message"
type = "interface_ok"
when = "status_error sent"
delay = 1.8

[[step]]
action = "caption"
when = "interface_ok arrived"
delay = 0.3
title = "6 · Operator recovery"
text = "Sample Complete is not enough: with the analyzer in error the carrier stays still, the needle is in the tube. An operator comes to the instrument for a recovery: the needle goes back up."

[[step]]
action = "operator"
when = "interface_ok arrived"
delay = 0.3
device = "analyzer"
duration = 7.0

[[step]]
action = "note"
when = "interface_ok arrived"
delay = 0.3
actor = "AN"
text = "Operator recovery"
duration = 6.0

[[step]]
action = "needle"
when = "interface_ok arrived"
delay = 2.8
device = "sp"
to = "up"
duration = 1.2

[[step]]
action = "caption"
when = "needle sp done"
delay = 2.6
title = "7 · Instrument ready"
text = "The instrument is green again: it sends its status (Ready) to the interface, which replies OK. Only now the carrier is released."

[[step]]
action = "status"
when = "needle sp done"
delay = 2.6
device = "analyzer"
state = "ready"

[[step]]
action = "message"
type = "status_ready"
when = "needle sp done"
delay = 2.6

[[step]]
action = "message"
type = "interface_ok"
when = "status_ready sent"
delay = 1.7

[[step]]
action = "status"
when = "status_ready sent"
delay = 3
device = "analyzer"
state = "normal"

[[step]]
action = "move"
when = "status_ready arrived"
delay = 1.9
carrier = "C1"
to = "spur_top_in"
ease = "in"

[[step]]
action = "move"
when = "C1 at spur_top_in"
carrier = "C1"
to = "merge"
ease = "linear"

[[step]]
action = "move"
when = "C1 at merge"
carrier = "C1"
to = "gone"
ease = "out"

[[step]]
action = "caption"
when = "C1 at merge"
title = "8 · Main-Lane — Release"
text = "The carrier went round the spur and is back on the Main-Lane: the interface sends Release."

[[step]]
action = "message"
type = "release"
when = "C1 at merge"
carrier = "C1"
