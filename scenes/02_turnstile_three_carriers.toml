[[step]]
action = "rotate"
at = 40.3
device = "ts"

[[step]]
action = "move"
at = 42.5
carrier = "C2"
to = "merge"
ease = "in"

[[step]]
action = "message"
type = "sample_acquisition"
at = 42.7
carrier = "C3"

[[step]]
action = "pipette"
