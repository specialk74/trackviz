# Scene 02 — turnstile with gate and antenna, three carriers with tubes, happy path
# The Pit-Lane ends in a turnstile: a wheel with three pockets (120° apart).
# Positions: entry (right, at Pit-Lane height), under the analyzer needle (top),
# exit (left, at Pit-Lane height). Each rotation moves entry -> needle -> exit.
# In front of the wheel there are an antenna and a gate: every carrier stops at
# the antenna (Prepare is sent again). It enters the wheel only if nothing is
# being sampled under the needle; otherwise it waits for Sample Complete. The
# wheel rotates only after the waiting carrier has entered.
# Carrier flow: right to left, Pit-Lane above the Main-Lane.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

include = ["common/video.toml", "common/actors.toml", "common/messages.toml", "common/turnstile.toml"]

[video]
subtitle = "Turnstile with gate and antenna, three carriers holding sample tubes — happy path"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "pit_wait", "ts.in", "ts.out", "pit_out", "merge", "main_out", "gone"]
speed = 75

[[carrier]]
id = "C2"
tube = true
sample_id = "SID-000124"
route = ["spawn", "main_in", "nsd", "pit_in", "pit_wait", "ts.in", "ts.out", "pit_out", "merge", "main_out", "gone"]
speed = 75
cap_color = "#0EA5E9"

[[carrier]]
id = "C3"
tube = true
sample_id = "SID-000125"
route = ["spawn", "main_in", "nsd", "pit_in", "pit_wait", "ts.in", "ts.out", "pit_out", "merge", "main_out", "gone"]
speed = 75
cap_color = "#DB2777"

# ---------------------------------------------------------------- steps
# Messages, captions and rotations use `at` (absolute start, seconds) so the
# rows of the sequence diagram stay in time order. Moves that continue another
# move without stopping (through the NSD) use start = "after", right after it.
# The second Prepare (sent at the antenna) is drawn in purple.

[[step]]
action = "caption"
at = 0
title = "1 · Turnstile with gate and antenna"
text = "The Pit-Lane ends in a turnstile, a wheel with three positions: entry, under the analyzer needle, exit. In front of it, an antenna and a gate: every carrier stops there first."

[[step]]
action = "move"
at = 2.26
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C1"
to = "pit_wait"
ease = "out"

[[step]]
action = "caption"
at = 4.77
title = "2 · Diverted — Prepare"
text = "The first carrier is diverted into the Pit-Lane without stopping, and the interface sends Prepare to the analyzer."

[[step]]
action = "highlight"
at = 4.77
device = "nsd"
duration = 2.0

[[step]]
action = "message"
type = "prepare"
at = 4.77
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
at = 6.77
carrier = "C1"

[[step]]
action = "message"
type = "query"
at = 8.57
carrier = "C1"

[[step]]
action = "move"
at = 9.96
carrier = "C2"
to = "nsd"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C2"
to = "pit_wait"
ease = "out"

[[step]]
action = "caption"
at = 10.62
title = "3 · Antenna — Prepare again"
text = "The carrier stops at the antenna in front of the gate: it is read and the interface sends Prepare again (later with an extra piece of information). Nothing is being sampled, so the gate opens."

[[step]]
action = "highlight"
at = 10.62
device = "antenna"
duration = 1.5

[[step]]
action = "message"
type = "prepare_again"
at = 10.82
carrier = "C1"

[[step]]
action = "message"
type = "tests"
at = 11.1
carrier = "C1"

[[step]]
action = "move"
at = 12.4
carrier = "C1"
to = "ts.in"
ease = "inout"
duration = 2.0

[[step]]
action = "caption"
at = 14.4
title = "4 · Rotation"
text = "Only now, with the carrier in the entry position, the wheel rotates and brings it under the needle. Meanwhile the second carrier is diverted: Prepare."

[[step]]
action = "rotate"
at = 14.55
device = "ts"

[[step]]
action = "highlight"
at = 14.57
device = "nsd"
duration = 2.0

[[step]]
action = "message"
type = "prepare"
at = 14.57
carrier = "C2"

[[step]]
action = "message"
type = "sample_ok"
at = 16.3
carrier = "C2"

[[step]]
action = "caption"
at = 16.6
title = "5 · Sample Acquisition — the next carrier waits"
text = "Under the needle: Sample Acquisition, then the analyzer aspirates. The second carrier is read at the antenna (Prepare again), but the gate stays closed while a sample is processed."

[[step]]
action = "message"
type = "sample_acquisition"
at = 16.8
carrier = "C1"

[[step]]
action = "pipette"
at = 18.4
device = "ts"
duration = 5.0

[[step]]
action = "message"
type = "query"
at = 18.6
carrier = "C2"

[[step]]
action = "highlight"
at = 20.45
device = "antenna"
duration = 1.5

[[step]]
action = "message"
type = "prepare_again"
at = 20.6
carrier = "C2"

[[step]]
action = "message"
type = "tests"
at = 20.9
carrier = "C2"

[[step]]
action = "move"
at = 23.46
carrier = "C3"
to = "nsd"
ease = "in"

[[step]]
action = "move"
start = "after"
carrier = "C3"
to = "pit_wait"
ease = "out"

[[step]]
action = "caption"
at = 23.6
title = "6 · Sample Complete — the waiting carrier enters"
text = "Sampling is finished: Sample Complete. Before the wheel rotates, the gate opens and the waiting carrier enters the entry position."

[[step]]
action = "message"
type = "sample_complete"
at = 23.7
carrier = "C1"

[[step]]
action = "move"
at = 25.4
carrier = "C2"
to = "ts.in"
ease = "inout"
duration = 2.0

[[step]]
action = "caption"
at = 27.5
title = "7 · Rotation — Sample Acquisition"
text = "Now the wheel rotates: the new carrier goes under the needle, the processed one to the exit and back to the Main-Lane. The third carrier is diverted."

[[step]]
action = "highlight"
at = 28.07
device = "nsd"
duration = 2.0

[[step]]
action = "message"
type = "prepare"
at = 28.07
carrier = "C3"

[[step]]
action = "rotate"
at = 27.5
device = "ts"

[[step]]
action = "move"
at = 29.7
carrier = "C1"
to = "merge"
ease = "in"

[[step]]
action = "message"
type = "sample_acquisition"
at = 29.9
carrier = "C2"

[[step]]
action = "message"
type = "sample_ok"
at = 30.1
carrier = "C3"

[[step]]
action = "pipette"
at = 31.7
device = "ts"
duration = 4.5

[[step]]
action = "message"
type = "query"
at = 32.0
carrier = "C3"

[[step]]
action = "caption"
at = 33.95
title = "8 · The third carrier waits at the gate"
text = "The third carrier is read at the antenna (Prepare again) and waits at the closed gate while the second sample is aspirated."

[[step]]
action = "highlight"
at = 33.95
device = "antenna"
duration = 1.5

[[step]]
action = "message"
type = "prepare_again"
at = 34.1
carrier = "C3"

[[step]]
action = "message"
type = "tests"
at = 34.4
carrier = "C3"

[[step]]
action = "caption"
at = 36.4
title = "9 · Sample Complete — Release — enter — rotate"
text = "Sample Complete for the second sample, Release for the first carrier, back on the Main-Lane. The third carrier enters the wheel, then the wheel rotates."

[[step]]
action = "message"
type = "sample_complete"
at = 36.5
carrier = "C2"

[[step]]
action = "move"
at = 36.88
carrier = "C1"
to = "gone"
ease = "out"

[[step]]
action = "message"
type = "release"
at = 36.88
carrier = "C1"

[[step]]
action = "move"
at = 38.2
carrier = "C3"
to = "ts.in"
ease = "inout"
