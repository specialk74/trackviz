[[step]]
action = "caption"
at = 49.2
title = "10 · Last carrier"
text = "Sample Complete for the third sample. No carrier is waiting at the gate: the wheel rotates the third carrier to the exit and it returns to the Main-Lane (Release)."

[[step]]
