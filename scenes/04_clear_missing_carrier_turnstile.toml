# Scene 04 — a carrier expected in the Pit-Lane never arrives: Clear (turnstile)
# Same situation as scene 03, with the turnstile, gate and antenna of scene 02.
# C2 is believed to be diverted (Prepare is sent) but physically goes straight
# on the Main-Lane; its logical position is a dashed ghost ("C2L"). C3 stops at
# the antenna on top of the ghost while C1 is being sampled. As soon as the
# antenna reads C3, the interface sends Clear for C2; after the analyzer's reply
# it sends Prepare again (purple) for C3, which then waits at the gate for
# Sample Complete as usual.
# Carrier flow: right to left, Pit-Lane above the Main-Lane.
# Coordinates are in a fixed 1920x1080 space (track panel: x 30..950, y 120..885).
# Points left of x=30 or right of x=950 are outside the panel (hidden).

include = ["common/video.toml", "common/actors.toml", "common/messages.toml", "common/turnstile.toml"]

[video]
subtitle = "A carrier expected in the Pit-Lane is missing — Clear (turnstile with gate and antenna)"

# ---------------------------------------------------------------- carriers
[[carrier]]
id = "C1"
tube = true
sample_id = "SID-000123"
route = ["main_in", "nsd", "pit_in", "pit_wait", "ts.in", "ts.out", "pit_out", "merge", "main_out", "gone"]
speed = 75

# The real C2: it is not diverted and goes straight on the Main-Lane.
[[carrier]]
id = "C2"
tube = true
sample_id = "SID-000124"
route = ["spawn", "main_in", "nsd", "merge", "main_out", "gone"]
speed = 75
cap_color = "#0EA5E9"

# Where the interface believes C2 is: diverted into the Pit-Lane, up to the antenna.
[[carrier]]
id = "C2L"
ghost = true
visible = false
tube = true
sample_id = "SID-000124"
tag = "SID-000124 (expected)"
route = ["nsd", "pit_in", "pit_wait"]
speed = 75
cap_color = "#0EA5E9"

[[carrier]]
id = "C3"
tube = true
sample_id = "SID-000125"
route = ["spawn", "main_in", "nsd", "pit_in", "pit_wait", "ts.in", "ts.out", "pit_out", "merge", "main_out", "gone"]
speed = 75
cap_color = "#DB2777"

# ---------------------------------------------------------------- steps
# Messages, captions and rotations use `at` (absolute start, seconds) so the
# rows of the sequence diagram stay in time order. The second Prepare (sent at
# the antenna) is drawn in purple.

[[step]]
action = "caption"
at = 0
title = "1 · Turnstile with gate and antenna"
text = "Three carriers holding sample tubes travel towards the interface. Every carrier diverted into the Pit-Lane stops at the antenna in front of the gate and the turnstile."

[[step]]
action = "move"
at = 2.26
carrier = "C1"
to = "nsd"
ease = "in"

[[step]]
action = "move"
when = "C1 at nsd"
carrier = "C1"
to = "pit_wait"
ease = "out"

[[step]]
action = "caption"
when = "C1 at nsd"
title = "2 · Diverted — Prepare"
text = "The first carrier is diverted into the Pit-Lane without stopping, and the interface sends Prepare to the analyzer."

[[step]]
action = "highlight"
when = "C1 at nsd"
device = "nsd"
duration = 2.0

[[step]]
action = "message"
type = "prepare"
when = "C1 at nsd"
carrier = "C1"

[[step]]
action = "message"
type = "sample_ok"
when = "prepare C1 sent"
delay = 1.997
carrier = "C1"

[[step]]
action = "message"
type = "query"
when = "sample_ok C1 arrived"
delay = 0.3
carrier = "C1"

[[step]]
action = "move"
at = 9.07
carrier = "C2"
to = "gone"
ease = "linear"

[[step]]
action = "caption"
when = "C1 at pit_wait"
title = "3 · Antenna — Prepare again"
text = "The first carrier is read at the antenna: Prepare again. Nothing is being sampled, so the gate opens, the carrier enters and the wheel brings it under the needle."

[[step]]
action = "highlight"
when = "C1 at pit_wait"
device = "antenna"
duration = 1.5

[[step]]
action = "message"
type = "prepare_again"
when = "C1 at pit_wait"
delay = 0.2
carrier = "C1"

[[step]]
action = "message"
type = "analyzer_ok"
when = "prepare_again C1 arrived"
delay = 0.1
carrier = "C1"

[[step]]
action = "message"
type = "tests"
when = "query C1 sent"
delay = 2.53
carrier = "C1"

[[step]]
action = "move"
at = 11.57
carrier = "C3"
to = "nsd"
ease = "linear"

[[step]]
action = "move"
at = 12.0
carrier = "C2L"
to = "pit_wait"
ease = "out"

[[step]]
action = "caption"
when = "tests C1 sent"
delay = 0.9
title = "4 · Physically straight, logically diverted"
text = "The second carrier should be diverted too, and the interface sends Prepare. But physically it goes straight on the Main-Lane: the dashed outline is where the interface believes it is."

[[step]]
action = "highlight"
when = "tests C1 sent"
delay = 0.9
device = "nsd"
duration = 2.0

[[step]]
action = "show"
when = "tests C1 sent"
delay = 0.9
carrier = "C2L"
duration = 0.4

[[step]]
action = "message"
type = "prepare"
when = "C2 at nsd"
carrier = "C2"

[[step]]
action = "move"
when = "C1 at pit_wait"
delay = 1.777
carrier = "C1"
to = "ts.in"
ease = "inout"
duration = 2.0

[[step]]
action = "message"
type = "sample_ok"
when = "prepare C2 sent"
delay = 1.6
carrier = "C2"

[[step]]
action = "move"
when = "C3 at nsd"
carrier = "C3"
to = "pit_wait"
ease = "out"

[[step]]
action = "caption"
when = "C3 at nsd"
title = "5 · Third carrier — Prepare"
text = "The third carrier is diverted into the Pit-Lane: Prepare. For each Prepare the analyzer asks DMX which tests to perform."

[[step]]
action = "highlight"
when = "C3 at nsd"
device = "nsd"
duration = 2.0

[[step]]
action = "message"
type = "prepare"
when = "C3 at nsd"
carrier = "C3"

[[step]]
action = "rotate"
when = "C1 at ts.in"
delay = 0.15
device = "ts"

[[step]]
action = "message"
type = "query"
when = "sample_ok C2 arrived"
delay = 0.1
carrier = "C2"

[[step]]
action = "message"
type = "sample_ok"
when = "prepare C3 sent"
delay = 1.597
carrier = "C3"

[[step]]
action = "message"
type = "sample_acquisition"
when = "rotate ts done"
delay = 0.25
carrier = "C1"

[[step]]
action = "message"
type = "analyzer_ok"
when = "sample_acquisition C1 arrived"
delay = 0.1
carrier = "C1"

[[step]]
action = "caption"
when = "query C2 arrived"
delay = 0.1
title = "6 · Sample Acquisition"
text = "The first carrier is under the needle: Sample Acquisition, and the analyzer aspirates. The second (expected) carrier reaches the antenna: nothing is read, it is not physically there."

[[step]]
action = "message"
type = "tests"
when = "query C2 sent"
delay = 2.2
carrier = "C2"

[[step]]
action = "pipette"
when = "analyzer_ok C1 arrived"
delay = 0.1
device = "ts"
duration = 6.6

[[step]]
action = "message"
type = "query"
when = "tests C2 arrived"
delay = 0.1
carrier = "C3"

[[step]]
action = "caption"
when = "C3 at pit_wait"
title = "7 · Antenna reads the third carrier — Clear"
text = "The third carrier stops at the antenna on top of the second one, which is not there. The antenna reads the third sample instead of the second: the interface sends Clear for the second."

[[step]]
action = "highlight"
when = "C3 at pit_wait"
device = "antenna"
duration = 1.5

[[step]]
action = "message"
type = "clear"
when = "C3 at pit_wait"
delay = 0.197
carrier = "C2"

[[step]]
action = "message"
type = "tests"
when = "query C3 sent"
delay = 1.7
carrier = "C3"

[[step]]
action = "message"
type = "sample_ok"
when = "clear C2 sent"
delay = 1.55
carrier = "C2"

[[step]]
action = "hide"
when = "sample_ok C2 arrived"
carrier = "C2L"
duration = 0.6

[[step]]
action = "caption"
when = "sample_ok C2 arrived"
title = "8 · Prepare again for the third carrier"
text = "Only after the reply to Clear the interface sends Prepare again for the third carrier. It waits at the closed gate until the first sample is complete."

[[step]]
action = "message"
type = "prepare_again"
when = "sample_ok C2 arrived"
delay = 0.2
carrier = "C3"

[[step]]
action = "message"
type = "analyzer_ok"
when = "prepare_again C3 arrived"
delay = 0.1
carrier = "C3"

[[step]]
action = "caption"
when = "pipette ts done"
delay = 0.2
title = "9 · Sample Complete — enter — rotate"
text = "Sample Complete for the first sample. The gate opens, the third carrier enters the wheel, then the wheel rotates: the third sample goes under the needle, the first one to the exit."

[[step]]
action = "message"
type = "sample_complete"
when = "pipette ts done"
delay = 0.2
carrier = "C1"

[[step]]
action = "message"
type = "interface_ok"
when = "sample_complete C1 arrived"
delay = 0.1
carrier = "C1"

[[step]]
action = "move"
when = "interface_ok C1 sent"
carrier = "C3"
to = "ts.in"
ease = "inout"
duration = 2.0

[[step]]
action = "rotate"
when = "C3 at ts.in"
delay = 0.15
device = "ts"

[[step]]
action = "move"
when = "rotate ts done"
delay = 0.15
carrier = "C1"
to = "merge"
ease = "in"

[[step]]
action = "message"
type = "sample_acquisition"
when = "rotate ts done"
delay = 0.25
carrier = "C3"

[[step]]
action = "message"
type = "analyzer_ok"
when = "sample_acquisition C3 arrived"
delay = 0.1
carrier = "C3"

[[step]]
action = "pipette"
when = "analyzer_ok C3 arrived"
delay = 0.1
device = "ts"
duration = 4.5

[[step]]
action = "caption"
when = "pipette ts done"
delay = 0.2
title = "10 · Back to normal"
text = "The first carrier has left the interface module: Release. Sample Complete for the third sample: the wheel brings it to the exit, and once it has left the module the interface sends Release."

[[step]]
action = "message"
type = "sample_complete"
when = "pipette ts done"
delay = 0.2
carrier = "C3"

[[step]]
action = "message"
type = "interface_ok"
when = "sample_complete C3 arrived"
delay = 0.1
carrier = "C3"

[[step]]
action = "move"
when = "C1 at merge"
carrier = "C1"
to = "gone"
ease = "out"

[[step]]
action = "message"
type = "release"
when = "C1 at main_out"
carrier = "C1"

[[step]]
action = "message"
type = "analyzer_ok"
when = "release C1 arrived"
delay = 0.1
carrier = "C1"

[[step]]
action = "rotate"
when = "interface_ok C3 sent"
device = "ts"

[[step]]
action = "move"
when = "rotate ts done"
delay = 0.2
carrier = "C3"
to = "merge"
ease = "in"

[[step]]
action = "move"
when = "C3 at merge"
carrier = "C3"
to = "gone"
ease = "out"

[[step]]
action = "message"
type = "release"
when = "C3 at main_out"
carrier = "C3"

[[step]]
action = "message"
type = "analyzer_ok"
when = "release C3 arrived"
delay = 0.1
carrier = "C3"

[[step]]
action = "caption"
when = "analyzer_ok C3 arrived"
delay = 0.5
title = "11 · Results"
text = "Later, when the analysis is complete, the analyzer sends the results to DMX."

[[step]]
action = "message"
type = "results"
when = "analyzer_ok C3 arrived"
delay = 0.5
carrier = "C1"

[[step]]
action = "message"
type = "results"
when = "results C1 arrived"
delay = 0.2
carrier = "C3"

